<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>袁氏世范 · 处己篇 —— 古籍阅读与对话请教</title>
<style>
  /* 标题手写楷体 · 霞鹜文楷（本文件已子集化，仅含标题字形，开源可商用） */
  @font-face{
    font-family:"霞鹜文楷";
    src:url('fonts/wenkai-title.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap;
  }
  /* 标题隶书 · 仅子集化「此间处己 · 语」6 个标题用字，2.7KB，全站设备显示一致 */
  @font-face{
    font-family:"标题隶书";
    src:url('fonts/lishu-title.ttf') format('truetype');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --canvas:#f5f1e9;            /* 宣纸米杏底 */
    --surface:#fffdf7;           /* 卡片面 */
    --surface-warm:#f2ede3;      /* AI气泡浅米黄 */
    --ink:#59332e;               /* 深棕褐主文字 */
    --ink-soft:#86776f;          /* 浅棕灰辅助 */
    --accent:#914642;            /* 赤陶红强调 */
    --accent-ink:#f7efe6;        /* 强调上文字 */
    --user-bubble:#5476ad;       /* 用户气泡雾霾蓝 */
    --user-bubble-ink:#ffffff;
    --line:rgba(89,51,46,.18);
    --send:#d4b0ad;              /* 莫兰迪粉棕 */
    --cinnabar:#b03a2e;          /* 朱砂红 */
    --radius:12px; --radius-lg:16px; --radius-sm:8px;
    --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",STSong,"SimSun",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  .scroll-deco{position:fixed;top:50%;transform:translateY(-50%);width:26px;height:calc(100vh - 140px);min-height:560px;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#f2ebd6,#e9dfc1 50%,#f0e7cc);
    border:1px solid rgba(145,70,66,.16);border-radius:8px;
    box-shadow:0 12px 32px rgba(89,51,46,.10), inset 0 0 10px rgba(145,70,66,.05);opacity:.85}
  .scroll-deco::before,.scroll-deco::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:38px;height:15px;
    background:linear-gradient(180deg,#e0bd85,#bd8f4f);border:1px solid rgba(140,90,30,.35);border-radius:7px;
    box-shadow:0 1px 3px rgba(89,51,46,.28)}
  .scroll-deco::before{top:-11px}
  .scroll-deco::after{bottom:-11px}
  .scroll-deco i{position:absolute;left:50%;top:14px;bottom:14px;width:1px;transform:translateX(-50%);
    background:linear-gradient(180deg,transparent,rgba(145,70,66,.10),rgba(145,70,66,.14),rgba(145,70,66,.10),transparent)}
  .scroll-deco.left{left:max(18px,calc((100vw - 1440px)/2 + 10px))}
  .scroll-deco.right{right:max(18px,calc((100vw - 1440px)/2 + 10px))}
  @media (max-width:1120px){.scroll-deco{display:none}}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 420px at 15% -6%, rgba(145,70,66,.035), transparent 60%),
      radial-gradient(1000px 380px at 92% -4%, rgba(84,118,173,.03), transparent 55%),
      var(--canvas);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  /* 四角极淡云纹（不进入内容区，透明度低于 5%） */
  body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
  body::before{background:
    radial-gradient(closest-side at 0% 0%, rgba(176,58,46,.05), transparent 72%),
    radial-gradient(closest-side at 100% 0%, rgba(84,118,173,.04), transparent 72%)}
  body::after{background:
    radial-gradient(closest-side at 0% 100%, rgba(176,58,46,.04), transparent 72%),
    radial-gradient(closest-side at 100% 100%, rgba(84,118,173,.05), transparent 72%)}
  .wrap{max-width:1380px;margin:0 auto;padding:14px clamp(14px,3vw,36px) 26px;position:relative;z-index:1}
  a{color:var(--accent);text-decoration:none}
  a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* 页头 */
  header.hero{padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px;text-align:center}
  h1{margin:0;font-family:"标题隶书","华文隶书","STLiti","LiSu","Baoli SC","隶书",serif;font-size:clamp(30px,4.2vw,44px);font-weight:400;line-height:1.2;letter-spacing:.06em;color:var(--ink)}
  /* 标题横幅：标题 + 横幅内朱砂小字副题 */
  .hero-title{position:relative;display:inline-block;padding:7px 34px 9px;background:linear-gradient(180deg,#f3ecd9,#eae0c4);border:1px solid rgba(145,70,66,.18);border-radius:9px;box-shadow:0 6px 18px rgba(89,51,46,.07);margin:0 auto;text-align:center}
  .hero-title::before,.hero-title::after{content:"";position:absolute;top:6px;bottom:6px;width:16px;background:linear-gradient(180deg,#e0bd85,#bd8f4f);border:1px solid rgba(140,90,30,.35);border-radius:7px;box-shadow:0 1px 3px rgba(89,51,46,.25)}
  .hero-title::before{left:-11px}
  .hero-title::after{right:-11px}
  .hero-title h1{font-size:clamp(24px,3vw,34px);line-height:1.15}
  /* 横幅内副题：朱砂小字，两侧渐隐细线，如落款引首 */
  .hero-sub{margin:2px 0 0;display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--cinnabar);white-space:nowrap}
  .hero-sub::before,.hero-sub::after{content:"";width:26px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(176,58,46,.55))}
  .hero-sub::after{background:linear-gradient(90deg,rgba(176,58,46,.55),transparent)}
  @media (max-width:560px){
    .hero-title{padding:6px 26px 8px}
    .hero-sub{font-size:11px;letter-spacing:.12em;gap:8px}
    .hero-sub::before,.hero-sub::after{width:14px}
  }
  .hero-meta{margin:8px auto 0;font-size:12px;color:var(--ink-soft);font-family:var(--sans);letter-spacing:.06em;display:inline-block;padding:6px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .hero-meta b{color:var(--accent);font-weight:600}

  /* 双栏 */
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;position:relative}
  .cols::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:rgba(89,51,46,.10);pointer-events:none}
  .pane{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:0 10px 30px rgba(89,51,46,.06);
    min-width:0;
  }
  .pane-head{
    padding:16px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .pane-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:.05em}
  .pane-head .tag{font-size:12px;color:var(--ink-soft);font-family:var(--sans)}
  /* 右栏页头：人物图标 + 标题居中，副题另起一行 */
  .chat-pane .pane-head{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 20px;gap:5px}
  .chat-pane .pane-head .master-book{width:34px;height:34px;margin-bottom:2px;color:var(--cinnabar)}
  .chat-pane .pane-head .tag{font-size:13px;letter-spacing:.02em;line-height:1.7;color:var(--accent);font-weight:500}
  .pane-note{padding:12px 20px;font-size:13.5px;color:var(--ink-soft);background:rgba(145,70,66,.035);border-bottom:1px solid var(--line);line-height:1.75}

  /* 左栏 · 列表 */
  .list{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
  .pane.read{display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:560px;background:linear-gradient(180deg,#f3ede1,#efe8d9)}
  .pane.chat-pane{display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:560px}
  /* 左栏标题头（古籍风） */
  .read-head{box-sizing:border-box;min-height:62px;padding:9px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(180deg,#f4eee2,#f0eadd)}
  .read-book{width:28px;height:28px;flex:0 0 auto;color:var(--cinnabar)}
  .read-head-txt{display:flex;flex-direction:column;justify-content:center;min-width:0}
  .read-title{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;line-height:1.3}
  .read-sub{margin:2px 0 0;font-family:var(--sans);font-size:11px;color:var(--ink-soft);line-height:1.45}
  .read-sub .x{color:var(--cinnabar);font-weight:600;font-family:var(--serif)}
  .read-sub b{color:var(--cinnabar);font-weight:600}
  .block.tx p{font-size:17px;line-height:1.9;font-family:"Kaiti SC","KaiTi","楷体","Songti SC",serif;font-weight:600}
  .block.modern p{line-height:1.85}
  article.entry{
    position:relative;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  article.entry:hover{border-color:rgba(145,70,66,.45);box-shadow:0 4px 14px rgba(89,51,46,.08)}
  /* 展开状态用独立的 .expanded class 控制，不与悬停态混用 */
  .entry.expanded{border-color:rgba(145,70,66,.55);background:rgba(145,70,66,.03)}
  /* 展开条目左侧朱砂竖线：3px，与卡片齐平 */
  .entry.expanded::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;background:var(--cinnabar)}
  /* 折叠展开：兼容性最好的 max-height 方案（grid 0fr/1fr 在部分 Safari 上不重绘），0.3s ease-in-out */
  .entry-body{max-height:0;overflow:hidden;transition:max-height .3s ease-in-out}
  .entry.expanded .entry-body{max-height:4000px}
  .entry-toggle{
    width:100%;min-height:48px;border:none;background:transparent;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    font-family:var(--serif);font-size:15.5px;font-weight:500;color:var(--ink);user-select:none;
    transition:background .2s var(--ease);
  }
  /* 展开时标题行背景略深，形成视觉区分 */
  .entry.expanded .entry-toggle{background:rgba(145,70,66,.07)}
  .entry-toggle::-moz-focus-inner{border:0}
  .entry-toggle .no{font-family:var(--sans);font-size:12px;color:var(--accent);font-weight:600;flex:0 0 auto;min-width:2.6em;letter-spacing:.02em}
  .entry-toggle .tt{flex:1 1 auto;min-width:0;font-family:"霞鹜文楷","Kaiti SC","KaiTi","楷体","Songti SC",var(--serif)}
  .entry-toggle::after{
    content:"⌄";flex:0 0 auto;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1;
    transform:rotate(-90deg);transition:transform .3s ease-in-out;
  }
  /* 展开时箭头同步旋转 90 度（朝右 → 朝下） */
  .entry.expanded .entry-toggle::after{transform:rotate(0deg)}
  /* 展开内容：区块间距统一 12px */
  .body{padding:0 18px}
  .body>*:first-child{margin-top:0}
  .block{margin:12px 0 0}
  .block.tx{background:#f1e7d4;border:1px solid rgba(89,51,46,.12);border-radius:10px;padding:13px 15px}
  .block.modern{background:#fffdf7;border:1px solid rgba(89,51,46,.08);border-radius:10px;padding:13px 15px}
  .block-label{font-size:13px;font-family:var(--sans);font-weight:600;color:var(--accent);letter-spacing:.12em;margin-bottom:4px}
  .block.tx p{margin:0;text-align:justify}
  .block.modern .block-label{color:var(--ink-soft)}
  .block.modern p{color:#5d463e;font-size:15px}
  .core-line{font-family:"Kaiti SC","KaiTi","楷体","Songti SC",serif;font-size:13px;color:#A63A2E;text-align:left;line-height:1.6;margin:12px 15px 0}
  .block.core{background:var(--surface-warm);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:9px 12px}
  .block.core .block-label{color:var(--accent)}
  .block.core p{font-size:14px;margin:0;color:#5d463e}
  .ask{
    display:block;padding:12px 15px 14px;
  }
  .ask-btn{
    font-family:var(--sans);font-size:13.5px;font-weight:600;color:#fff;
    background:var(--cinnabar);border:1px solid var(--cinnabar);border-radius:10px;
    padding:11px 18px;cursor:pointer;width:100%;box-sizing:border-box;text-align:center;
    box-shadow:0 4px 12px rgba(176,58,46,.22);
    transition:background .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
    letter-spacing:.02em;
  }
  .ask-btn:hover{
    background:#8e2a1f;border-color:#8e2a1f;transform:translateY(-1.5px);
    box-shadow:0 7px 16px rgba(176,58,46,.28);
  }

  /* 右栏 · 对话 */
  .chat-frame{padding:0;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;position:relative}
  /* 聊天背景水印小字 */
  /* 右栏 · 先生档案条 */
  .master-bar{box-sizing:border-box;min-height:62px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 18px;background:rgba(145,70,66,.05);border-bottom:1px solid var(--line)}
  .avatar{width:42px;height:42px;border-radius:50%;flex:0 0 auto;background:#f7f2e6 url('assets/yuancai-avatar.png') center/cover no-repeat;border:1.5px solid rgba(145,70,66,.28);box-shadow:0 1px 4px rgba(89,51,46,.22)}
  .master-info{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
  .master-name{font-size:15px;font-weight:700;letter-spacing:.04em}
  .master-desc{font-family:var(--sans);font-size:11px;color:#a03a2e;margin-top:1px;text-shadow:0 0 1px rgba(176,58,46,.08)}
  .master-greet{flex:1 1 100%;margin:2px 0 0;font-family:var(--sans);font-size:12px;color:var(--accent);border-left:2px solid rgba(176,58,46,.35);padding-left:10px;line-height:1.6}
  .chat-pills{padding:12px 18px 4px;display:flex;flex-wrap:wrap;gap:8px}
  .pill{
    font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;
    transition:all .18s var(--ease);
  }
  .pill:hover{color:var(--accent);border-color:var(--accent);background:rgba(145,70,66,.05)}

  /* 打印 */
  @media print{
    body{background:#fff}
    .cols{grid-template-columns:1fr}
    .cols::before{display:none}
    .pane.read,.pane.chat-pane{height:auto;min-height:0}
    .chat-frame{height:auto}
    .list{max-height:none;overflow:visible}
    header.hero{border-bottom:none}
    .pane{box-shadow:none;page-break-inside:avoid}
    article.entry{page-break-inside:avoid}
  }
  /* 中等宽度窗口/平板横屏：收窄左栏标题字号，避免长标题折行后顶出固定高度 */
  @media (min-width:921px) and (max-width:1180px){
    .read-head{gap:10px;padding:8px 14px}
    .read-book{width:24px;height:24px}
    .read-title{font-size:13.5px;letter-spacing:.02em}
    .read-sub{font-size:10.5px}
    .master-bar{gap:10px;padding:9px 14px}
    .avatar{width:38px;height:38px}
  }
  @media (max-width:920px){
    .cols{grid-template-columns:1fr}
    .cols::before{display:none}
    .pane.read,.pane.chat-pane{height:70vh;min-height:520px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }

  /* ===== 对话区 ===== */
  .chat-msgs{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
  .msg{display:flex;flex-direction:column;gap:5px;max-width:90%;animation:rise .3s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;align-items:flex-end}
  .msg.bot{align-self:flex-start;align-items:flex-start;position:relative;padding-left:48px}
  .msg.bot::before{content:"";position:absolute;left:0;top:2px;width:36px;height:36px;border-radius:50%;background:#f7f2e6 url('assets/yuancai-avatar.png') center/cover no-repeat;border:1px solid rgba(145,70,66,.22);box-shadow:0 1px 3px rgba(89,51,46,.18)}
  .msg .who{font-family:var(--sans);font-size:12px;color:var(--ink-soft);letter-spacing:.05em}
  .msg .bubble{
    padding:11px 15px;border-radius:14px;line-height:1.75;font-size:15px;
    white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 8px rgba(89,51,46,.05);
  }
  .msg.bot .bubble{background:var(--surface-warm);border:1px solid var(--line);border-top-left-radius:4px;color:#5d463e}
  .msg.user .bubble{background:var(--user-bubble);color:var(--user-bubble-ink);border-top-right-radius:4px}
  .msg .src{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft)}
  .msg .mt{font-family:var(--sans);font-size:10px;color:rgba(89,51,46,.45);align-self:flex-end;margin-top:1px;user-select:none}
  .typing{display:inline-flex;gap:4px;align-items:center;padding:5px 2px;min-width:34px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  .bubble-think{color:#8a6a52;font-style:italic;letter-spacing:.03em;opacity:.0;animation:fadeUp .35s forwards}
  .bubble-think::after{content:"⌛";display:inline-block;margin-left:6px;font-style:normal;animation:sway 1.6s ease-in-out infinite;opacity:.65}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

  /* 输入区 */
  .chat-input{display:flex;gap:10px;align-items:flex-end;padding:12px 16px 16px;border-top:1px solid var(--line)}
  .chat-input textarea{
    flex:1 1 auto;resize:none;min-height:46px;max-height:140px;
    font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.6;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;
    outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
  }
  .chat-input textarea:focus{
    border-color:rgba(84,118,173,.6);
    box-shadow:0 0 0 3px rgba(84,118,173,.12);
  }
  .chat-input textarea:disabled{opacity:.6}
  .send-btn{
    flex:0 0 auto;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--accent-ink);
    background:var(--accent);border:none;border-radius:12px;padding:0 20px;height:46px;cursor:pointer;
    transition:filter .2s var(--ease);
  }
  .send-btn:hover{filter:brightness(1.08)}
  .send-btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- 开卷动画 ---------- */
  #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 40%,#f7f0e0,#eadcc0);transition:opacity .8s ease}
  .intro-scroll{display:flex;align-items:stretch;height:214px;max-width:94vw}
  /* 小人：立于卷轴纸面内右侧，卷轴展定后轻轻亮相 */
  .intro-char{position:absolute;right:26px;bottom:-3px;height:168px;z-index:2;opacity:0;
    transform:translateY(14px) scale(.9);transform-origin:bottom center;
    transition:opacity .8s ease 1.7s,transform .8s cubic-bezier(.34,1.45,.5,1) 1.7s}
  .intro-char img{height:100%;width:auto;
    filter:drop-shadow(0 7px 10px rgba(89,51,46,.3));
    animation:charBob 3.6s ease-in-out 3s infinite}
  @keyframes charBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  #intro.open .intro-char{opacity:1;transform:translateY(0) scale(1)}
  /* 圆木轴：整根圆柱形，上下略探出纸面，端头全圆；横向明暗模拟柱面弧光，两端深色作轴头 */
  .intro-rod{flex:0 0 46px;align-self:center;height:calc(100% + 30px);margin:0 -1px;border-radius:999px;position:relative;z-index:3;
    background:
      linear-gradient(90deg,rgba(74,44,14,.55) 0%,rgba(120,74,26,.16) 22%,rgba(255,236,190,.6) 45%,rgba(255,242,208,.55) 52%,rgba(120,74,26,.16) 78%,rgba(74,44,14,.55) 100%),
      linear-gradient(180deg,#7d5427 0,#d8ac63 16px,#bf8c46 50%,#d8ac63 calc(100% - 16px),#7d5427 100%);
    box-shadow:0 10px 22px rgba(89,51,46,.3),inset 0 3px 7px rgba(255,238,200,.28),inset 0 -5px 10px rgba(74,44,14,.36)}
  .intro-rod::after{content:"";position:absolute;top:20px;bottom:20px;left:50%;width:14px;margin-left:-7px;border-radius:7px;
    background:linear-gradient(180deg,transparent,rgba(255,243,214,.4) 25%,rgba(255,243,214,.4) 75%,transparent)}
  /* 初始完全闭合：纸面宽度与内边距均为 0，左右轴杆贴合；展开时二者同步过渡 */
  .intro-paper{position:relative;flex:0 0 0px;min-width:0;overflow:hidden;display:grid;place-items:center;align-content:center;text-align:center;
    padding:0;
    background:linear-gradient(90deg,#f0e6cc,#f7efda 50%,#efe5c8);
    box-shadow:inset 18px 0 22px -18px rgba(120,70,25,.5),inset -18px 0 22px -18px rgba(120,70,25,.5),inset 0 0 0 1px rgba(145,70,66,.12),0 10px 30px rgba(89,51,46,.18);
    transition:flex-basis 1.9s cubic-bezier(.55,0,.2,1),padding 1.9s cubic-bezier(.55,0,.2,1)}
  #intro.open .intro-paper{flex-basis:min(76vw,900px);padding:0 200px 0 50px}
  .intro-paper h1{margin:0;padding:0 16px;font-family:"标题隶书","华文隶书","STLiti","LiSu","Baoli SC","隶书",serif;
    font-size:clamp(40px,6vw,63px);font-weight:400;line-height:1.12;letter-spacing:.1em;color:#5a3b2c;
    opacity:0;white-space:nowrap;transform:translateY(8px) scale(.96);
    transition:opacity 1.15s ease 1.2s,transform 1.15s ease 1.2s}
  .intro-paper p{margin:8px 0 0;padding:0 24px;font-family:var(--sans);font-size:17px;line-height:1.55;color:var(--cinnabar);letter-spacing:.12em;
    opacity:0;transition:opacity 1.1s ease 2.05s}
  #intro.open .intro-paper h1{opacity:1;transform:translateY(0) scale(1)}
  #intro.open .intro-paper p{opacity:1}
  #intro.hide{opacity:0;pointer-events:none}
  /* 中屏（平板/小窗）收一档标题字号，避免长标题在纸面内被裁切 */
  @media (min-width:601px) and (max-width:1100px){
    .intro-paper h1{font-size:clamp(26px,5vw,52px)}
  }
  @media (max-width:600px){
    .intro-scroll{height:172px;max-width:100%}
    .intro-rod{flex:0 0 33px;height:calc(100% + 20px)}
    .intro-rod::after{top:13px;bottom:13px;width:9px;margin-left:-4.5px}
    #intro.open .intro-paper{flex-basis:calc(100vw - 110px);padding:0 86px 0 18px}
    .intro-char{height:84px;right:6px;bottom:0}
    .intro-paper h1{font-size:24px;letter-spacing:.03em;white-space:nowrap;padding:0}
    .intro-paper p{font-size:11px;line-height:1.55;letter-spacing:.03em;margin-top:6px;
      justify-self:start;text-align:left;max-width:168px;padding:0 0 0 2px}
  }
  @media (max-width:380px){
    .intro-char{height:74px}
    .intro-paper h1{font-size:22px}
    .intro-paper p{font-size:10.5px;max-width:140px}
  }
</style>
</head>

<div class="scroll-deco left" aria-hidden="true"><i></i></div>

        </div>

      <div class="list" id="entry-list"><!-- 条目由脚本渲染，勿手写静态副本（否则会重复） --></div>

<script>
(function(){
  "use strict";
  // ------ 数据注入点：__DATA__ 会被构建脚本替换为 68 则数组字面量 ------
    var CHUJI = JSON.parse("[{\"no\":\"2.1\",\"title\":\"人之智识有高下\",\"original\":\"人之智识固有高下，又有高下殊绝者。高之见下，如登高望远，无不尽见；下之视高，如在墙外欲窥墙里。若高下相去差近犹可与语；若相去远甚，不如勿告，徒费口颊舌尔。譬如弈棋，若高低止较三五着，尚可对弈，国手与未识筹局之人对弈，果何如哉？\",\"modern\":\"人与人之间的智力和知识水平有高下之分，有的相差悬殊。水平高的人看水平低的，如同登高望远，一览无余；水平低的人看水平高的，就像在墙外想窥墙里，什么也看不见。高低相差无几还可以交流，相差太远则不如不说，白费口舌。就像下棋，水平只差三五着还能对弈，若一个是国手，一个连规则都不懂，那结果可想而知。\",\"core\":\"人的智识天资有别，教育应因材施教，不可强求一律。\"},{\"no\":\"2.2\",\"title\":\"处富贵不宜骄傲\",\"original\":\"富贵乃命分偶然，岂宜以此骄傲乡曲！若本自贫窭，身致富厚，本自寒素，身致通显，此虽人之所谓贤，亦不可以此取尤于乡曲。若因父祖之遗资而坐享肥浓，因父祖之保任而驯致通显，此何以异于常人！其间有欲以此骄傲乡曲，不亦羞而可怜哉！\",\"modern\":\"谁富谁贵，在人生中是极偶然的事，岂能因为富贵了就在乡里作威作福！如果本来贫穷后来致富，本来出身微贱后来身居高官，这种人虽有才能也不应在家乡过于招摇。如果靠祖先遗产而过上富足生活，依靠父祖保举而获得高官，与常人有什么区别？他们若还想借此在乡邻面前炫耀，不仅令人羞愧，更令人感到可怜。\",\"core\":\"富贵乃命运偶然，不论何种途径获得都不应骄横乡里。\"},{\"no\":\"2.3\",\"title\":\"礼不可因人轻重\",\"original\":\"世有无知之人，不能一概礼待乡曲。而因人之富贵贫贱设为高下等级。见有资财有官职者则礼恭而心敬。资财愈多，官职愈高，则恭敬又加焉。至视贫者，贱者，则礼傲而心慢，曾不少顾恤。殊不知彼之富贵，非吾之荣，彼之贫贱，非我之辱，何用高下分别如此！长厚有识君子必不然也。\",\"modern\":\"世上有些没见识的人，不能一视同仁地对待乡亲，却根据他人的富贵贫贱划分等级。见到有钱有官的就恭敬有加，钱财越多官职越高就越恭敬。而见到贫穷地位低的人就态度傲慢心下轻视，很少去关照周济。殊不知别人的富贵不是自己的荣耀，别人的贫贱也不是自己的耻辱，何必用不同态度对待！德行深厚有识有见的人决不会这么做。\",\"core\":\"待人应一视同仁，不可因他人富贵贫贱而改变态度。\"},{\"no\":\"2.4\",\"title\":\"操守与穷达自两途\",\"original\":\"操履与升沉，自是两途。不可谓操履之正，自宜荣贵，操履不正，自宜困厄。若如此，则孔、颜应为宰辅，而古今宰辅达官，不复小人矣。盖操履自是吾人当行之事，不可以此责效于外物。责效不效，则操履必怠，而所守或变，遂为小人之归矣。今世间多有愚蠢而享富厚，智慧而居贫寒者，皆有一定之分，不可致诘。若知此理，安而处之，岂不省事。\",\"modern\":\"品行的好坏与仕途的升降是两回事，没有必然联系。不能说品行端正就该享受荣华富贵，品行不端就该遭受厄运。如果那样，孔子、颜回就应该当宰相了，而古往今来的宰相中就不应有小人了。培养德行是我们应该做的事，不能因此带有什么功利目的，否则一旦没有达到目的，就必然放松品德修养从而沦为小人。世间有很多愚蠢的人享受富贵，聪明的人却很贫寒，这些都是命运的安排，不必深究。明白这个道理泰然处之，岂不省去许多烦恼。\",\"core\":\"品行与富贵无必然联系，修身是本分，当安于天命。\"},{\"no\":\"2.5\",\"title\":\"世事更变皆天理\",\"original\":\"世事多更变，乃天理如此。今世人往往见目前稍稍荣盛，以为此生无足虑，不旋踵而破坏者多矣。大抵天序十年一换甲，则世事一变。今不须广论久远，只以乡曲十年前、二十年前比论目前，其成败兴衰何尝有定势！世人无远识，凡见他人兴进及有如意事则怀妒，见他人衰退及有不如意事则讥笑。同居及同乡人最多此患。若知事无定势，则自虑之不暇，何暇妒人笑人哉！\",\"modern\":\"世上之事变化多端，这是客观规律。世人往往看到眼前稍有兴旺就以为一辈子不用发愁了，殊不知转眼间就家破人亡的事太多了。不要论说久远的事，就说乡里十年前、二十年前与现在比一比，就会发现成败兴衰是没有定式的。世上的人没有远见，见到别人兴旺发达就嫉妒，见到别人衰退就讥笑。同族或同乡的人最容易有这毛病。如果知道凡事没有固定不变的道理，为自己考虑恐怕还来不及，哪有时间去妒人笑人？\",\"core\":\"世事无常，兴衰无定势，当以此自警而不去妒人笑人。\"},{\"no\":\"2.6\",\"title\":\"人生劳逸常相若\",\"original\":\"膺高年享富贵之人，必须少壮之时尝尽艰难，受尽辛苦，不曾有自少壮享富贵安逸至老者。早年登科及早年受奏补之人，必于中年龃龉不如意，却于暮年方得荣达。或仕宦无龃龉，必其生事窘薄，忧饥寒，虑婚嫁。若早年宦达，不历艰难辛苦，及承父祖生事之厚，更无不如意者，多不获高寿。造物乘除之理类多如此。其间亦有始终享富贵者，乃是有大福之人，亦千万人中间有之，非可常也。今人往往机心巧谋，皆欲不受辛苦，即享富贵至终身。盖不知此理，而又非理计较，欲其子孙自小安然享大富贵，尤其蔽惑也，终于人力不能胜天。\",\"modern\":\"年老享受富贵的人，必定年轻时吃尽了苦头历尽了艰辛。从来没有从小享受安逸富贵直到老年的。年少就科举及第或早得官职的，中年必定仕途坎坷，到了晚年才荣贵显达。或早年官运亨通，家中生活就一定窘迫拮据。如果说年少身登显贵又没品尝艰难困苦，又继承了父祖的丰厚家业，这种人大多不会活得很大。造物主安排命运大多如此。偶尔有始终享受富贵的，是千万人中才有一个大福份的人。现在的人机关算尽想不经历劳苦就享富贵到终身，更是不可理喻。最终人算不如天算。\",\"core\":\"人生苦乐相参，造物乘除之理如此，不可妄图不劳而获。\"},{\"no\":\"2.7\",\"title\":\"贫富定分任自然\",\"original\":\"富贵自有定分。造物者既设为一定之分，又设为不测之机，役使天下之人，朝夕奔趋，老死而不觉。不如是，则人生天地间全然无事，而造化之术穷矣。然奔趋而得者，不过一二；奔趋而不得者，盖千万人。世人终以一二者之故，至于劳心费力。老死无成者多矣。不知他人奔趋而得，亦其定分中所有者。若定分中所有，虽不奔趋，迟以岁月，亦终必得。故世有高见远识超出造化机关之外，任其自去自来者，其胸中平夷。无忧喜，无怨尤，所谓奔趋及相倾之事未尝萌于意见，则亦何争之有？前辈谓死生贫富生来注定。君子赢得为君子，小人枉了做小人。此言甚切，人自不知耳。\",\"modern\":\"人富贵与否是有定数的。造物主既把命运注定了，又留给人莫测的变化，驱使人们为权势钱财奔走忙碌到死都不醒悟。可是真正得到富贵的仅是很少的人，奔走忙碌一生什么也得不到的人却成千上万。世上的人就因为有很少的人争得了富贵便去劳心费力。殊不知别人成功也是命中早已注定的。如果命中注定你富贵，即使不奔忙多等些时候也终究能得到。所以有见识高远看破红尘的人，只是任其自然心中平静。没有什么值得忧愁高兴的，也没有什么值得怨尤的。为利益奔忙或与人争斗的念头从未在胸中萌生过，能与人有什么争执呢？前辈说生死富贵都是命注定的。注定是君子就能成为君子，注定是小人再折腾也还是小人。这话非常正确只是人一般不知道罢了。\",\"core\":\"富贵有定数，高见远识者任其自然，胸中平夷无忧无怨。\"},{\"no\":\"2.8\",\"title\":\"忧患顺受则少安\",\"original\":\"人生世间，自有知识以来，即有忧患不如意事。小儿叫号，皆其意有不平。自幼至少至壮至老，如意之事常少，不如意之事常多。虽大富贵之人，天下之所仰羡以为神仙，而其不如意处各自有之，与贫贱人无异，特所忧虑之事异尔。故谓之缺陷世界，以人生世间无足心满意者。能达此理而顺受之，则可少安。\",\"modern\":\"人活在世间，自从有了知觉识见就有了忧患和不称心的事。小孩子哭闹都是因为有些事没达到他的要求。从幼到少到壮到老，如意的事少不如意的事常常很多。即使大富大贵的人天下人都羡慕他过的是神仙一般的日子，但他也都有各自的烦恼不称心处跟贫民百姓没什么两样，只不过所忧虑的事情跟普通人不一样罢了。所以我们把这个世界叫做缺陷世界。人活在世上没有谁能处处如意事事美满。能深刻地明白这个道理而在遇到挫折时安然处之，就能感到心里顺畅一些。\",\"core\":\"人生本是缺陷世界，不如意事常八九，能达此理而顺受则心安。\"},{\"no\":\"2.9\",\"title\":\"谋事难成则永久\",\"original\":\"凡人谋事，虽日用至微者，亦须龃龉而难成，或几成而败，既败而复成。然后，其成也永久平宁，无复后患。若偶然易成，后必有不如意者。造物微机不可测度如此，静思之则见此理，可以宽怀。\",\"modern\":\"大凡人们要谋划干一件事，即使是日常生活中最微小的事也一定会发生一些摩擦不如意而难以成功，或者快成了又失败了。经历几番后才得以成功。这样反复以后得到的成功却能保持永久平安而无有后患。如果偶然间有事情很轻易就成功了，日后一定会发生不如意的事情。大千世界事物的发展变化简直不可测度。静下心来好好思考一下就能明白这个道理，对于成功与失败也就能够安然释怀了。\",\"core\":\"好事多磨，经反复而成功者方能永久无患。\"},{\"no\":\"2.10\",\"title\":\"性有所偏在救失\",\"original\":\"人之德性出于天资者，各有所偏。君子知其有所偏，故以其所习为而补之，则为全德之人。常人不自知其偏，以其所偏而直情径行，故多失。《书》言九德，所谓宽、柔、愿、乱、扰、直、简、刚、强者，天资也；所谓栗、立、恭、敬、毅、温、廉、塞、义者，习为也。此圣贤之所以为圣贤也。后世有以性急而佩韦、性缓而佩弦者，亦近此类。虽然，己之所谓偏者，苦不自觉，须询之他人乃知。\",\"modern\":\"人的品德性格从生下来就各有各的缺陷。有学问有修养的人知道自己的不足之处所以用加强学习的办法来弥补，于是变成了一个具有完美品德的人。普通的人不知道自己的不足被这种不足支配着率性行事所以造成许多过失。《尚书》中说有九种德性即“宽、柔、愿、乱、扰、直、简、刚、强”这些是天生的；而“栗、立、恭、敬、毅、温、廉、塞、义”这些是通过学习养成的。这就是圣贤之所以能成为圣贤的凭借。后世有性急的人佩带韦皮、性缓的人佩带紧绷的弓弦也是这个道理。即使这样自己的不足之处常常自己无法知道必须向他人请教才能知道。\",\"core\":\"天资各有偏颇，君子以学习补之而成全德。\"},{\"no\":\"2.11\",\"title\":\"人行有长短\",\"original\":\"人之性行虽有所短，必有所长。与人交游，若常见其短，而不见其长，则时日不可同处；若常念其长，而不顾其短，虽终身与之交游可也。\",\"modern\":\"人的性格品行，虽有短处，也一定有长处。与人交往，如果经常注意别人的短处，而无视别人的长处，那就连一刻也难以与人相处。相反的，如果常想着别人的长处，而不去计较他的短处，就是一辈子相交下去，也能和睦。\",\"core\":\"常念人长、不顾人短，方能长久相处。\"},{\"no\":\"2.12\",\"title\":\"人不可怀慢伪妒疑之心\",\"original\":\"处己接物，而常怀慢心、伪心、妒心、疑心者，皆自取轻辱于人，盛德君子所不为也。慢心之人自不如人，而好轻薄人。见敌己以下之人，及有求于我者，面前既不加礼，背后又窃讥笑。若能回省其身，则愧汗浃背矣。伪心之人言语委曲，若甚相厚，而中心乃大不然。一时之间人所信慕，用之再三则踪迹露见，为人所唾去矣。妒心之人常欲我之高出于人，故闻有称道人之美者，则忿然不平，以为不然；闻人有不如人者，则欣然笑快，此何加损于人，只厚怨耳。疑心之人，人之出言，未尝有心，而反复思绎曰：“此讥我何事？此笑我何事？”则与人缔怨，常萌于此。贤者闻人讥笑，若不闻焉，此岂不省事！\",\"modern\":\"待人接物时如果总是怀着傲慢、虚伪、嫉妒、怀疑之心那就是自己向人讨取轻蔑与侮辱。品德高尚的君子不会这么干。有傲慢之心的人自己不如人却喜欢轻薄别人见到地位低于自己以及有求于己的人不仅当面不以礼相待还在背后讥笑。这种人如果能反省自身可能会惭愧得汗流浃背。怀有虚伪之心的人言语委婉动听好像很厚道可心里大相径庭。这种人可能一时还被人信任打上二三次交道真面目就暴露了最终被人唾弃。怀有嫉妒之心的人常想自己高出别人听到赞美别人就忿忿不平听到别人有缺陷就欣然笑快，其实这对别人有什么损害只不过徒增怨恨。怀有疑心的人别人随口说的话他却反反复复想“这是在讥讽我什么事”与人结怨往往从此开始。贤明的人听到别人讥讽嘲笑就像没听见一样岂不是省了许多烦恼。\",\"core\":\"慢心、伪心、妒心、疑心四者皆自取轻辱，当力戒之。\"},{\"no\":\"2.13\",\"title\":\"人贵忠信笃敬\",\"original\":\"言忠信，行笃敬，乃圣人教人取重于乡曲之术。盖财物交加，不损人而益己，患难之际，不妨人而利己，所谓忠也。有所许诺，纤毫必偿，有所期约，时刻不易，所谓信也。处事近厚，处心诚实，所谓笃也。礼貌卑下，言辞谦恭，所谓敬也。若能行此，非惟取重于乡曲，则亦无入而不自得。然敬之一事，于己无损，世人颇能行之，而矫饰假伪，其中心则轻薄，是能敬而不能笃者，君子指为谀佞，乡人久亦不归重也。\",\"modern\":\"言论讲究忠信，行动奉行笃敬，这是圣人教人们获得乡里敬重的方法。在财物方面，不干损人利己的事；在关键时刻，不干妨碍别人、方便自己的事。这就是“忠”。一旦许诺言，一丝一毫也要有结果；一旦定期有约，一时一刻也不耽误。这就是“信”。待人接物，热情厚道，内心诚实敦厚。这就是“笃”。礼貌谨慎，言辞谦逊。这就是“敬”。如果能做到这些，不仅能得到乡亲的敬重，干任何事都能顺利。然而恭敬待人，因为对自己毫无损失，世人还能做到；可是如果不能表里如一，表面很好，心中却轻视鄙薄，就成了能“敬”而不能“笃”了，君子会把他称为谄佞小人们，乡亲们久而久之也不会再敬重他。\",\"core\":\"忠信笃敬是立身处世的根本，表里如一方为真敬。\"},{\"no\":\"2.14\",\"title\":\"厚于责己而薄于责人\",\"original\":\"忠、信、笃、敬，先存其在己者，然后望其在人。如在己者未尽，而以责人，人亦以此责我矣。今世之人能自省其忠、信、笃、敬者盖寡，能责人以忠、信、笃、敬者皆然也。虽然，在我者既尽，在人者也不必深责。今有人能尽其在我者固善矣，乃欲责人之似己，一或不满吾意，则疾之已甚，亦非有容德者，只益贻怨于人耳！\",\"modern\":\"忠诚有信、厚道恭敬，这些品德先要自身具备，然后才可能希望别人具有。如果自己还没有完全达到，却以此来苛求别人，别人便也会以此来责怪你了。现在，能自我反省是否做到了忠信笃敬的人很少，而以之来要求别人的却比比皆是。其实，即使自己做到了，也不必要求别人一定做到。有的人自己做到了，就想要别人也像他一样，一时不称心，就狠狠责备人家。这种人绝非有容人之德的人，是很容易与人结怨的。\",\"core\":\"先正己再正人，严于律己不必深责于人，方为有容德者。\"},{\"no\":\"2.15\",\"title\":\"处事当无愧心\",\"original\":\"今人有为不善之事，幸其人之不见不闻，安然自得，无所畏忌。殊不知人之耳目可掩，神之聪明不可掩。凡吾之处事，心以为可，心以为是，人虽不知，神已知之矣。吾之处事，心以为不可，心以为非，人虽不知，神已知之矣。吾心即神，神即祸福，心不可欺，神亦不可欺。《诗》曰：“神之格思，不可度思，矧可射思。”释者以谓“吾心以为神之至也”，尚不可得而窥测，况不信其神之在左右，而以厌射之心处之，则亦何所不至哉？\",\"modern\":\"现在有人干了坏事庆幸没被人发现便洋洋自得无所顾忌。殊不知别人的耳目可以掩蔽神的聪明却难逃脱。我们做事心里认为可以、认为正确别人虽然不知道神明已经知道了。心里认为不可、认为不对别人虽然不知道神明也知道了。我们的心就是神明神明就是祸福自己的心骗不了神明也骗不了。《诗经》上说：“神明的思路我们想不通又怎能反对呢？”释者说“我的心能感觉到神明的到来”对此尚且不能探究明白何况那些不相信神明就在身边的人用厌恶的心对待它那他们又有什么事做不出来呢？\",\"core\":\"吾心即神，做事当问心无愧，此即儒家“慎独”精神。\"},{\"no\":\"2.16\",\"title\":\"为恶祷神为无益\",\"original\":\"人为善事而无遂，祷之于神，求其阴助，虽未见效，言之亦无愧。至于为恶而未遂，亦祷之于神，求其阴助，岂非欺罔！如谋为盗贼而祷之于神，争讼无理而祷之于神，使神果从其言而幸中，此乃贻怒于神，开其祸端耳。\",\"modern\":\"人做好事不能成功，向神祷告请求暗中帮助，即使没有成效，说起来也不羞愧。至于干坏事不能成功，也向神祷告请求暗中帮助，这不是荒诞至极！如果想去偷盗而祈求神保佑，打无理官司而祈求神保佑，假使神果真听从，帮你成功了，这便是惹怒神明、自求祸端。\",\"core\":\"为恶而祷神是自欺欺人，只会招致更大祸患。\"},{\"no\":\"2.17\",\"title\":\"公平正直人之当然\",\"original\":\"凡人行己公平正直者，可用此以事神，而不可恃此以慢神；可用此以事人，而不可恃此以傲人。虽孔子亦以敬鬼神、事大夫、畏大人为言，况下此者哉！彼有行己不当理者，中有所慊，动辄知畏，犹能避远灾祸，以保其身。至于君子而偶罹于灾祸者，多由自负以召致之耳。\",\"modern\":\"行为公平正直的，可以以此事奉神，而不能依仗此来怠慢神；可以以此对待人，而不能依仗此来轻慢人。即使孔子，也敬畏鬼神、事奉大夫、顺从大人，何况庶民百姓呢！自己行事没有道理时，心中应有所畏惧，这样才能躲避灾祸、保全自身。至于君子有时遇到灾难，多半是过于自负所引起的。\",\"core\":\"公平正直不可恃以傲人慢神，谦虚谨慎方能远祸。\"},{\"no\":\"2.18\",\"title\":\"悔心为善之几\",\"original\":\"人之处事，能常悔往事之非，常悔前言之失，常悔往年之未有知识，其贤德之进，所谓长日加益，而人不自知也。古人谓行年六十，而知五十九之非者，可不勉哉！\",\"modern\":\"人处世，能常常对自己做错的往事悔恨不已，对过去说错的话后悔不已，对过去的无知感到羞愧不已，那么在品德方面，就有日益的长进。这种日渐进步，人们往往自己认识不到。古人称，年纪到了六十岁，就知道五十九岁的过错，难道我们不能以此自勉吗？\",\"core\":\"常怀悔心、反省己过，则贤德日进而不自知。\"},{\"no\":\"2.19\",\"title\":\"恶事可戒而不可为\",\"original\":\"凡人为不善事而不成，正不须怨天尤人，此乃天之所爱，终无后患。如见他人为不善事常称意者，不须多羡，此乃天之所弃。待其积恶深厚，从而殄灭之。不在其身，则在其子孙。姑少待之，当自见也。\",\"modern\":\"一个人做坏事而不成，正不该怨天尤人，这是上天对这个人的厚爱，使他最终没有遭来祸患。如果看见他人做坏事称心如意，也不应该羡慕，这正是上天对他已经厌弃的结果。等到他积累的坏事既深且厚之时，从而一举歼灭。不在他自己身上体现，也会延及子孙。姑且等待一段时间，自然会看到。\",\"core\":\"为恶不成是天之厚爱，为恶得志是积恶将灭之兆。\"},{\"no\":\"2.20\",\"title\":\"善恶报应难穷诘\",\"original\":\"人有所为不善，身遭刑戮，而其子孙昌盛者，人多怪之，以为天理有误。殊不知此人之家，其积善多，积恶少，少不胜多，故其为恶之人身受其报，不妨福祚延及后人。若作恶多而享寿富安乐，必其前人之遗泽将竭，天不爱惜，恣其恶深，使之大坏也。\",\"modern\":\"有人做了坏事，自身遭受刑罚杀戮，可是子孙却很昌盛，人们常常感到奇怪，以为天理有误。殊不知这户人家积善多、积恶少，少不胜多，所以做坏事的人自身承受报应，不妨碍福泽延及后人。如果作恶多端，却享受长寿、富贵、安乐，那必定是祖先的遗泽将尽，上天不再爱惜、放纵他，恶贯满盈，使他最终彻底败坏。\",\"core\":\"善恶报应的道理深邃难测，不可因表面现象而怀疑天理。\"},{\"no\":\"2.21\",\"title\":\"人能忍事则无争心\",\"original\":\"人能忍事，易以习熟，终至于人以非理相加，不可忍者，亦处之如常。不能忍事，亦易以习熟，终至于睚眦之怨深，不足较者，亦至交詈争讼，期以取胜而后已，不知其所失甚多。人能有定见，不为客气所使，则身心岂不大安宁！\",\"modern\":\"人如果善于忍耐，并逐渐习以为常，即使别人对他施以非礼，到不可忍耐的地步，也能处之泰然。人如果不善于忍耐，也习以为常，即使别人对他一点小小的怨恨，根本不值得计较，也总竭尽全力去打官司，不到取胜决不罢休，却不知道自己失去的远比得到的多。人如果有明确的见解，不为外界事物所干扰，身心就会得到极大的安宁。\",\"core\":\"忍耐可习而成之，有定见不为外物所使则身心安宁。\"},{\"no\":\"2.22\",\"title\":\"小人当敬远\",\"original\":\"人之平居，欲近君子而远小人者。君子之言，多长厚端谨，此言先入于吾心，乃吾之临事，自然出于长厚端谨矣；小人之言多刻薄浮华，此言先入于吾心，及吾之临事，自然出于刻薄浮华矣。且如朝夕闻人尚气好凌人之言，吾亦将尚气好凌人而不觉矣；朝夕闻人游荡不事绳检之言，吾亦将游荡不事绳检而不觉矣。如此非一端，非大有定力，必不免渐染之患也。\",\"modern\":\"日常生活中，人们都想亲近君子、远离小人。君子的言论，大多忠厚、端庄、严谨，这种言论先进入我心中，遇到事情时，自然也会忠厚端庄。小人的言论，多为刻薄浮华，如果先进入我心中，遇到事情时，自然也有了刻薄浮华的言行。正如早晚听的都是盛气凌人之言，我也会变得盛气凌人而不自知；早晚听目无法纪的言论，我也会变得游荡无度。像这样的情况很多，如果没有很强的自控能力，必然免不了逐渐沾染的不良后果。\",\"core\":\"近君子远小人，因言行为人渐染之力极大。\"},{\"no\":\"2.23\",\"title\":\"老成之言更事多\",\"original\":\"老成之人，言有迂阔，而更事为多。后生虽天资聪明，而见识终有不及。后生例以老成为迂阔，凡其身试见效之言欲以训后生者，后生厌听而毁诋者多矣。及后生年齿渐长，历事渐多，方悟老成之言可以佩服，然已在险阻艰难备尝之后矣。\",\"modern\":\"年老之人的言论，有时显得迂腐，但老年人经历的世事很多，阅历丰富。年轻人即使天资聪颖，在人生阅历及识见方面，终难与老年人相比。年轻人总认为老年人迂腐，老年人用亲身经历来教导时，年轻人很多不喜欢听，还要诋毁。等到年轻人年岁增长、经历世事增多之后，才体悟到老人之言值得佩服，但那时，早已在备尝艰辛之后了。\",\"core\":\"老成之言虽似迂阔，实为阅历之谈，当虚心听取。\"},{\"no\":\"2.24\",\"title\":\"君子有过必思改\",\"original\":\"圣贤犹不能无过，况人非圣贤，安得每事尽善？人有过失，非其父兄，孰肯诲责；非其契爱，孰肯谏谕。泛然相识，不过背后窃讥之耳。君子惟恐有过，密访人之有言，求谢而思改。小人闻人之有言，则好为强辩，至绝往来，或起争讼者有矣。\",\"modern\":\"圣贤尚且不能没有过错，何况一般人不是圣贤，怎么能每件事都尽善尽美呢？一个人犯了过错，不是父母兄长，谁肯教诲责备他？不是情意相投的朋友，谁肯规谏劝告他？关系一般的人，不过背地里议论罢了。君子惟恐自己有过错，暗暗察访别人对自己的议论，听到后，便感谢并考虑改正。小人听到别人的议论，就强行辩解，甚至断绝来往，还有人为此对簿公堂。\",\"core\":\"君子闻过则改，小人闻过则辩，知错必改方为真君子。\"},{\"no\":\"2.25\",\"title\":\"言语贵简寡\",\"original\":\"言语简寡，在我，可以少悔；在人，可以少怨。\",\"modern\":\"说话简短，并且少言寡语，对于自己来说，可以减少因为言语不周而造成的懊悔；对于别人来说，可以减少对我的怨恨。\",\"core\":\"言多必失，言语简寡可少悔少怨。\"},{\"no\":\"2.26\",\"title\":\"小人为恶不必谏\",\"original\":\"人之出言举事，能思虑循省，而不幸有失，则在可谏可议之域。至于恣其性情，而妄言妄行，或明知其非而故为之者，是人必挟其凶暴强悍以排人之异己。善处乡曲者，如见似此之人，非惟不敢谏诲，亦不敢置于言议之间，所以远侮辱也。尝见人不忍平昔所厚之人有失，而私纳忠言，反为人所怒，曰：“我与汝至相厚，汝亦谤我耶！”孟子曰：“不仁者，可与言哉？”\",\"modern\":\"一个人说话办事能深思熟虑、不断反省，不幸犯了过错，可以对他进行规谏。至于那种随心所欲、胡作非为，或者明知是错却故意去做的人，必定会凭借凶暴强悍，来排除别人对自己的议论。善于处理邻里关系的人，看到这种人，不但不敢劝告，就是听到别人议论他，也要躲开，以避免受辱。我曾看到有人不忍心厚交之人犯过失，用诚恳的话规劝，反倒引起那人恼怒，说：“你和我交情深厚，难道也来毁谤我吗？”孟子说：“不讲仁义的人，怎么能够和他交谈呢？”\",\"core\":\"对明知故犯、凶暴强悍之人不必谏诲，远之即可。\"},{\"no\":\"2.27\",\"title\":\"觉人不善知自警\",\"original\":\"以此，不善人虽人所共恶，然亦有益于人。大抵见不善人则警惧，不至自为不善。不见不善人则放肆，或至自为不善而不觉。故家无不善人，则孝友之行不彰；乡无不善人，则诚厚之迹不著。譬如磨石，彼自销损耳，刀斧资之以为利。老子云：“不善人乃善人之资。”谓此尔。若见不善人而与之同恶相济，及与之争为长雄，则有损而已，夫何益？\",\"modern\":\"不善的人，虽然大家都厌恶，但他的存在对别人也有好处。一般人见不善的人，就会自觉警醒恐惧，避免自己做出不善之事。如果从来看不到不善的人，不能引起警惕，可能就会放肆胡为。因此，家里没有不善的人，孝敬父母、团结兄弟的品行，就不会突出；乡里没有不善的人，诚实敦厚的行为，也不会显著。这就好比磨刀石，它自己被磨损了，刀斧却依靠它变得锋利。老子说“不善良的人，乃是善良人的借鉴”，说的就是这个道理。如果看到不善的人，却和他一同做恶，甚至比比谁更恶劣，只能有损自己罢了。\",\"core\":\"不善人乃善人之借鉴，见不善当自省警惧。\"},{\"no\":\"2.28\",\"title\":\"不肖子弟有不必谏者\",\"original\":\"乡曲有不肖子弟，耽酒好色，博弈游荡，亲近小人，豢养驰逐，轻于破荡家产，至为乞丐窃盗者，此其家门厄数如此，或其父祖稔恶至此。未闻有因谏诲而改者，虽其至亲，亦当处之无可奈何，不必喋喋，徒厚其怨。\",\"modern\":\"乡里有些不肖子弟，沉迷酒色、赌博游荡，亲近小人，豢养鹰犬、驰骋追逐，轻易败坏家产，甚至沦为乞丐盗贼。这是家门气数如此，或是其父祖积恶所致。从未听说有因劝谏教诲而改过的；即使是至亲，也只能无可奈何地处之，不必喋喋不休地劝说，只会徒增他们的怨恨罢了。\",\"core\":\"不肖子弟破荡家产，乃家门气数使然，劝谏无效当无奈处之。\"},{\"no\":\"2.29\",\"title\":\"正己可以正人\",\"original\":\"勉人为善，谏人为恶，固是美事，先须自省。若我之平昔自不能为，岂惟人不见听，亦反为人所薄。且如己之立朝可称，乃可诲人以立朝之方：己之临政有效，乃可诲人以临政之术；己之才学为人所尊，乃可诲人以进修之要；己之性行为人所重，乃可诲人以操履之详；己能身致富厚，乃可诲人以治家之法；己能处父母之侧而谐和无间，乃可诲人以至孝之行。苟为不然，岂不反为所笑！\",\"modern\":\"勉励别人行善、规劝别人止恶，当然是好事，但必须先自我反省。如果自己平时也做不到，不但不会被别人听取，反倒要被别人鄙薄。就好比自己在朝为官，有被人称颂之处，才可以用立朝之法教诲别人；自己处理政事卓有成效，才可以用临政之术教诲别人。自己的才学被人尊崇，才可以教人进修之要；品性被人尊重，才可以教人操行之详；自己能发家致富，才可以用治家之法教诲别人；能与父母和睦相处，才可以用孝顺行为教诲别人。如果说自己尚且做不到，却去教诲别人，岂不反被别人耻笑？\",\"core\":\"正人先正己，己所不能勿施于人。\"},{\"no\":\"2.30\",\"title\":\"浮言不足恤\",\"original\":\"人有出言至善，而或有议之者；人有举事至当，而或有非之者。盖众心难一，众口难齐如此。君子之出言举事，苟揆之吾心，稽之古训，询之贤者，于理无碍，则纷纷之言皆不足恤，亦不必辨。自古圣贤，当代宰辅，一时守令，皆不能免，居乡曲，同为编氓，尤其无所畏，或轻议己，亦何怪焉？大抵指是为非，必妒忌之人，及素有仇怨者，此曹何足以定公论，正当勿恤勿辩也。\",\"modern\":\"有人话说得极为善良得体，还有对他非议的；有人做事做得极为得当，还有对他非议的。众人的心思难以一致，众口难以齐一。君子说话办事，如果能本着良心、参考古训、向贤者请教，在道理上没有缺陷，纷纷议论，都不必担忧考虑，也不必争辩。自古圣贤、当代宰辅、一时太守县令，都不能免于被议论，何况在乡井中同为平民百姓，更不必畏惧别人议论了。有的人轻易议论自己，有什么奇怪？硬把对的说成错的，一定是妒忌之人，或有仇怨的人，这些人说的话，怎么能定为公论？正当不加考虑、不加辩解。\",\"core\":\"做事合乎良心古训则浮言不足恤，不必争辩。\"},{\"no\":\"2.31\",\"title\":\"谀巽之言多奸诈\",\"original\":\"人有善诵我之美，使我喜闻而不觉其谀者，小人之最奸黠者也。彼其面谀吾而吾喜，及其退与他人语，未必不窃笑我为他所愚也。人有善揣人意之所向，先发其端，导而迎之，使人喜其言与己暗合者，亦小人之最奸黠者也。彼其揣我意而果合，及其退与他人语，又未必不窃笑我为他所料也。此虽大贤，亦甘受其侮而不悟，奈何？\",\"modern\":\"有些人善于当面称颂我的好处，让我喜欢听，而不觉其阿谀奉承，这是小人中最奸诈狡黠的一种。他当面奉承令我高兴，回去和别人谈起来，未必不会暗地嘲笑我被他愚弄了。有些人善于揣摩别人的心意，找出话题引导迎合，使人高兴，他的言论与自己暗合，这也是小人中最奸邪的一种。他揣摩我的心意，果然符合，回去和别人谈起来，又未必不暗地嘲笑我被料到了。即使大贤之人，也甘心受这种小人的欺骗而不醒悟，无可奈何啊。\",\"core\":\"善于阿谀奉承、揣摩人意者是小人中最奸黠之人，当深察之。\"},{\"no\":\"2.32\",\"title\":\"凡事不为己甚\",\"original\":\"人有詈人而人不答者，人必有所容也。不可以为人之畏我，而更求以辱之。为之不已，人或起而我应，恐口噤而不能出言矣。人有讼人而人不校者，人必有所处也。不可以为人之畏我，而更求以攻之。为之不已，人或出而我辨，恐理亏而不能逃罪也。\",\"modern\":\"有人辱骂别人，而别人不理会，这一定有涵养、容忍了他。我们不能认为别人怕我们，而进一步去侮辱他。总这样做，人家就有可能反击，到那时，恐怕吓得说不出话来了。有人和别人争讼，而别人不计较，这是人家有自己的考虑。不要以为别人怕我们，而进一步攻击。攻击个没完，人家站出来辩论，恐怕就会理亏，不能逃罪了。\",\"core\":\"不可把别人的宽容当作软弱，凡事不可过分。\"},{\"no\":\"2.33\",\"title\":\"言语虑后则少怨尤\",\"original\":\"亲戚故旧，人情厚密之时，不可尽以密私之事语之，恐一旦失欢，则前日所言，皆他人所凭以为争讼之资。至有失欢之时，不可尽以切实之语加之，恐忿气既平之后，或与之通好结亲，则前言可愧。大抵忿怒之际，最不可指其隐讳之事，而暴其父祖之恶。吾之一时怒气所激，必欲指其切实而言之，不知彼之怨恨深入骨髓。古人谓“伤人之言，深于矛戟”是也。俗亦谓“打人莫打膝，道人莫道实”。\",\"modern\":\"亲戚朋友、故交旧识，即便在关系融洽、感情深厚时，也不可以把隐秘之事全部告诉他们。恐怕一旦关系恶化，从前的话，就成了他人争讼的资本。还有，在关系恶化时，也不要用过分的言辞侮辱人家，恐怕怒气平息后，还要恢复友好，甚至结为亲戚，那从前的话，就令人惭愧了。一般来说，怒不可遏时，切不可揭露别人隐私，或暴露别人父祖的恶事。我们被一时怒气驱使，一定要揭人短处，不知人家对我们的怨恨，由此深入骨髓。古人说“言语对人的伤害，比长矛剑戟还厉害”，说得对啊！俗话也说“打人莫打膝，说人莫揭短”。\",\"core\":\"盛怒时言语当慎重，不可揭人隐私、暴人父祖之恶。\"},{\"no\":\"2.34\",\"title\":\"与人言语贵和颜\",\"original\":\"亲戚故旧，因言语而失欢者，未必其言语之伤人，多是颜色辞气暴厉，能激人之怒。且如谏人之短，语虽切直，而能温颜下气，纵不见听，亦未必怒。若平常言语，无伤人处，而词色俱厉，纵不见怒，亦须怀疑。古人谓“怒于室者色于市”，方其有怒，与他人言，必不卑逊。他人不知所自，安得不怪！故盛怒之际与人言语尤当自警。前辈有言：“诫酒后语，忌食时嗔，忍难耐事，顺自强人。”常能持此，最得便宜。\",\"modern\":\"亲朋好友、故交旧识，因说话不当而交情破裂的，未必是因为说了伤害别人的话，很多是因为态度、言辞、语气过于粗暴，激起了别人的愤怒。比如规谏别人的短处，话语虽然恳切直爽，却能温颜下气，纵使不被听取，也不至于惹怒对方。平常说话，本没有伤人之处，而言辞声色都很严厉，即使不被恼怒，也会引起怀疑。古人说“在家里生气后，难免把怒色带到外面”，正值生气时，和别人说话，一定不会谦逊。别人不知原因，怎能不奇怪！因此，在大怒时说话，更应警惕。前辈说：喝酒后戒说话，吃饭时忌生气，能忍难忍的事，不与自以为是的人争论。经常坚持这样做，最得好处。\",\"core\":\"言语伤人往往不在内容而在态度，当平心静气、温颜下气。\"},{\"no\":\"2.35\",\"title\":\"老人当敬重优容\",\"original\":\"高年之人，乡曲所当敬者，以其近于亲也。然乡曲有年高而德薄者，谓刑罚不加于己，轻詈辱人，不知愧耻。君子所当优容而不较也。\",\"modern\":\"年纪大的人，在乡里之所以受人尊敬，因为他们年龄上和自己的父母接近。然而，乡里也有年纪虽高而品德不够的人，认为刑罚施加不到自己身上，动不动就辱骂别人，而不知惭愧羞耻。君子对这样的人，应该能够宽容，不去与他们计较。\",\"core\":\"敬老是美德，遇年高而德薄者当优容不争。\"},{\"no\":\"2.36\",\"title\":\"与人交游贵和易\",\"original\":\"与人交游，无问高下，须常和易，不可妄自尊大，修饰边幅。若言行崖异，则人岂复相近！然又不可太亵狎，樽酒会聚之际，固当歌笑尽欢，恐嘲讥中触人讳忌，则忿争兴焉。\",\"modern\":\"和别人交往，不管对方地位高低，态度必须平和亲切，切不可妄自尊大、讲究穿着服饰。如果言谈举止一副高高在上的派头，谁还愿意和你接近？然而，也不能过分亲近。喝酒聚会时，固然应该高歌欢笑、尽情畅饮，但也要说话谨慎，否则，在嘲讽讥刺中触犯别人忌讳，可能就要引起争吵了。\",\"core\":\"交友当平和亲切、不可自大，亦不可过分亲昵触犯忌讳。\"},{\"no\":\"2.37\",\"title\":\"才行高人自服\",\"original\":\"行高人自重，不必其貌之高；才高人自服，不必其言之高。\",\"modern\":\"品行高尚的人，自然会受到别人的敬重，不一定他的容貌有多出众、身材有多高大；才能高超的人，自然会受到别人敬服，不一定他的言辞有多高明。\",\"core\":\"真正的尊重来自品行和才能，而非外貌和言辞。\"},{\"no\":\"2.38\",\"title\":\"小人作恶必天诛\",\"original\":\"居乡曲间，或有贵显之家，以州县观望而凌人者。又有高资之家，以贿赂公行而凌人者。方其得势之时，州县不能奈何，鬼神犹或避之，况贫穷之人，岂可与之较？屋宅坟墓之所邻，山林田园之所接，必横加残害，使归于己而后已。衣食所资，器用之微，凡可其意者，必夺而有之。如此之人惟当逊而避之，逮其稔恶之深，天诛之加，则其家之子孙自能为其父祖破坏，以与乡人复仇也。乡曲更有健讼之人，把持短长，妄有论讼，以致追扰，州县不敢治其罪。又有恃其父兄子弟之众，结集凶恶，强夺人所有之物，不称意则群聚殴打。又复贿赂州县，多不竟其罪。如此之人，亦不必求以穷治，逮其稔恶之深，天诛之加，则无故而自罹于宪网，有计谋所不及救者。大抵作恶而幸免于罪者，必于他时无故而受其报。所谓“天网恢恢，疏而不漏”也。\",\"modern\":\"在乡里，有显贵之家以权势欺凌别人，有钱人以贿赂官府横行乡里。这些人在得势时，州县都不敢动他们，连鬼神都避让，何况贫穷百姓？对于临近他们房屋、坟墓、山林、田园的地方，必然横加残害，弄到自己手里方才罢休。别人的衣物器用，只要他喜欢，就要夺取。对这种人，只能避开，等他恶贯满盈时，上天自然会惩罚他。乡里还有爱诉讼的人，抓住别人短处到处宣扬、告官，州县都不敢治罪。还有倚仗父兄子弟众多，纠集凶徒，强夺别人东西，不称意就聚众殴打的人，行贿官府，得不到惩治。这些人，也不必一定要惩治，等他们罪孽深重时，上天自会诛罚，他们就会无故落入法网，有计谋也来不及挽救了。大抵做坏事而侥幸免罪的，日后必定遭到报应。这就是“天网恢恢，疏而不漏”。\",\"core\":\"乡里恶人当逊避之，天网恢恢疏而不漏，作恶者终受天谴。\"},{\"no\":\"2.39\",\"title\":\"君子小人有二等\",\"original\":\"乡曲士夫，有挟术以待人，近之不可，远之则难者，所谓君子中之小人，不可不防，虑其信义有失，为我之累也。农、工、商、贾、仆、隶之流，有天资忠厚可任以事、可委以财者，所谓小人中之君子，不可不知，宜稍抚之以恩，不复虑其诈欺也。\",\"modern\":\"乡里面的读书人，有的在待人接物时玩弄手腕，亲近他不行，又很难远离他，这就是所说的君子中的小人，对这种人不能不提防，怕他不讲信义，连累了我们。在农民、手工业者、商人、奴仆等人中，有天性忠厚老实，可以把事托付给他办、可以把财物托付给他保管的，这些人，就是所说的小人中的君子，应当了解这些人，用恩惠来安抚他们，就不必担心他们欺诈人了。\",\"core\":\"君子中有小人当防之，小人中有君子当知之，不可一概而论。\"},{\"no\":\"2.40\",\"title\":\"居官居家本一理\",\"original\":\"士大夫居家能思居官之时，则不至干请把持而挠时政；居官能思居家之时，则不至狠愎暴恣而贻人怨。不能回思者皆是也。故见任官每每称寄居官之可恶，寄居官亦多谈见任官之不韪，并与其善者而掩之也。\",\"modern\":\"士大夫闲居在家时，能思索一下做官时的所作所为，就不至于再去干预政治了；做官时，能思索一下闲居在家时的心情，就不至于刚愎自用、暴戾恣肆，而为人怨恨了。但是，许多人就是不善于反省过去。因此，正在为官的人，往往说赋闲在家的人讨厌；赋闲在家的人，也往往说正在为官的人这也不对、那也不对，连人家做得好的地方，也一笔抹杀了。\",\"core\":\"在朝在野当互相理解、善于回思反省。\"},{\"no\":\"2.41\",\"title\":\"小人难责以忠信\",\"original\":\"忠信二事，君子不守者少，小人不守者多。且如小人以物市于人，敝恶之物，饰为新奇；假伪之物，饰为真实。如绢帛之用胶糊，米麦之增湿润，肉食之灌以水，药材之易以他物。巧其言词，止于求售，误人食用，有不恤也。其不忠也类如此。负人财物久而不偿，人苟索之，期以一月，如期索之不售，又期以一月，如期索之又不售。至于十数期而不售如初。工匠制器，要其定资，责其所制之器，期以一月，如期索之不得，又期以一月，如期索之又不得，至于十数期而不得如初。其不信也类如此，其他不可悉数。小人朝夕行之，略不知怪，为君子者往往忿懥，直欲深治之，至于殴打论讼。若君子自省其身，不为不忠不信之事，而怜小人之无知，及其间有不得已而为自便之计，至于如此，可以少置之度外也。\",\"modern\":\"“忠”“信”二字，君子不奉守的少见，小人往往不守。小人在市场上卖东西，质量低劣的，也能修饰得新颖奇特；假冒伪劣的，也能做得跟真的一样。比如用胶糊处理丝绢、布帛，使之有光泽；在米麦肉里加水，增加重量；用便宜东西代替名贵药材。花言巧语，只为把东西卖出去，不管耽误别人。欠人钱财，久拖不还，约了十多次偿还日期，还是没还。请工匠做东西，给了定金，约了十多次日期，还是拿不到。这些人不讲信义，至于其他事，就更不可胜数了。他们每天做不讲信义的事，不以为怪；君子深感气愤，想严惩他们。如果君子能经常反省自己，不做不忠不信之事，并且可怜小人的无知，考虑到他们是不得已才如此，也就不把他们放在心上了。\",\"core\":\"小人言行多有不忠不信，君子当自省而不必深责。\"},{\"no\":\"2.42\",\"title\":\"戒货假药\",\"original\":\"张安国舍人知抚州日，以有卖假药者，出榜戒约曰：“陶隐居、孙真人，因《本草》、《千金方》济物利生，多积阴德，名在列仙。自此以来，行医货药，诚心救人，获福报者甚众，不论方册所载，只如近时，此验尤多，有只卖一真药便家资巨万，或自身安荣，享高寿；或子孙及第，改换门户，如影随形，无所差错。又曾眼见货卖假药者，其初积得些小家业，自谓得计，不知冥冥之中，自家合得禄料都被减克。或自身多有横祸，或子孙非理破荡，致有遭天火、被雷震者。盖缘赎药之人，多是疾病急切，将钱告求卖药之家，孝子顺孙只望一服见效，却被假药误赚，非惟无益，反致损伤。寻常误杀一飞禽走兽，犹有因果，况万物之中人命最重，无辜被祸，其痛何穷！”词多更不尽载。舍人此言，岂止为假药者言之，有识之人，自宜触类。\",\"modern\":\"张安国舍人主管抚州时，因有卖假药的人，贴出一张告示：“陶弘景、孙真人因为写了《本草》《千金方》，救治百姓，积了很多阴德，最后成了仙人。自他们以来，行医卖药、诚心救人、获得福报的人很多。有的人只卖一种真药，就积了巨万家资，或自身荣华、享有高寿，或子孙及第、改变门庭。我曾亲眼看见卖假药的人，最初赚了些小钱，自以为得手，不知冥冥之中，自家应得的财物都减少了，或自身屡遭横祸，或子孙倾家荡产，甚至遭受火灾、被雷击。因为买药的人，多是重病在身，孝子顺孙，只望一副药见效，却被假药误害，不但无益，反致损伤。平常误杀一只飞禽走兽，还有报应，何况万物之中，人命最宝贵，无辜丧命，该多么令人伤痛！”告示言辞很多，我无法全记下来。这些话，难道只是对卖假药的人说的吗？有识之士应该触类旁通。\",\"core\":\"卖假药害人害己，必遭报应；凡事当触类旁通。\"},{\"no\":\"2.43\",\"title\":\"言貌重则有威\",\"original\":\"市井街巷，茶坊酒肆，皆小人杂处之地。吾辈或有经由，须当严重其辞貌，则远轻侮之患。或有狂醉之人，宜即回避，不必与之较可也。\",\"modern\":\"市井街巷、茶坊酒肆，都是小人经常往来的地方，我们到这些地方去时，言谈举止一定要严肃端庄，才能不被轻视侮辱。要是有喝得酩酊大醉的人找你寻衅，也应该躲开他，不必和他计较。\",\"core\":\"在复杂场所当严肃端庄，遇狂醉之人宜回避不争。\"},{\"no\":\"2.44\",\"title\":\"衣服不可侈异\",\"original\":\"衣服举止异众，不可游于市，必为小人所侮。\",\"modern\":\"衣服举止与众不同的人，不要到街市上去游玩，否则，一定会遭到小人的侮辱。\",\"core\":\"衣着举止不宜标新立异，异众则易招致轻侮。\"},{\"no\":\"2.45\",\"title\":\"居乡曲务平淡\",\"original\":\"居于乡曲，舆马衣服不可鲜华。盖乡曲亲故，居贫者多，在我者孑然异众，贫者羞涩，必不敢相近，我亦何安之有？此说不可与口尚乳臭者言。\",\"modern\":\"居住在乡里，面车马衣服不可以鲜艳华丽。因为乡里亲戚朋友，贫困的占多数，我们与众不同，贫困的人感到不好意思，一定不敢接近我们，自己如何能安心呢？这些话，不必与乳臭未干的未成年人讲。\",\"core\":\"居乡当平民化，不可鲜华异众使贫者疏远。\"},{\"no\":\"2.46\",\"title\":\"妇女衣饰务洁净\",\"original\":\"妇女衣饰，惟务洁净，尤不可异众。且如十数人同处，而一人之衣饰独异，众所指目，其行坐能自安否？\",\"modern\":\"妇女的衣服，只要干净整洁就行了，切不可与众不同。如果十几个人在一起，其中一个人衣服鲜艳华丽，大家都把目光集中在她一人身上，她坐立行走，还能同往常一样自如吗？\",\"core\":\"妇女衣饰以洁净为宜，不可出众招人注目。\"},{\"no\":\"2.47\",\"title\":\"礼义制欲之大闲\",\"original\":\"饮食，人之所欲，而不可无也，非理求之，则为饕为馋；男女，人之所欲，而不可无也，非理狎之，则为奸为淫；财物，人之所欲，而不可无也，非理得之，则为盗为贼。人惟纵欲，则争端起而狱讼兴。圣王虑其如此，故制为礼，以节人之饮食、男女；制为义，以限人之取与。君子于是三者，虽知可欲，而不敢轻形于言，况敢妄萌于心！小人反是。\",\"modern\":\"饮食是人的自然欲望，不可缺少，不合道理地追求，就是贪吃；男女之事是人的本能欲求，不可缺少，不合理地满足，就是奸淫；财物谁都想获得，不可缺少，靠非法手段取得，就是盗贼。人如果放纵欲望，就会引起争端，免不了打官司。圣王考虑到这些，因此制定礼仪，以节制饮食和男女关系；制定道义，以限制人对财物的获取。君子对于这三样东西，虽然知道是自己所需要的，但不敢表达出来，更何况萌生妄想呢！小人正好相反。\",\"core\":\"饮食男女财物皆人之常欲，当以礼义节制。\"},{\"no\":\"2.48\",\"title\":\"见得思义则无过\",\"original\":\"圣人云：不见可欲，使心不乱。此最省事之要术。盖人见美食而下咽，见美色而必凝视，见钱财而必起欲得之心，苟非有定力者，皆不免此。惟能杜其端源，见之而不顾，则无妄想，无妄想则无过举矣。\",\"modern\":\"圣人说：不去看那些可能引起欲望的东西，心里就不会迷乱。这是省去诸多烦恼的秘诀。人见了美食就咽口水，见美色就凝视，见了钱财就起贪心，如果不是思想坚定的人，都难免如此。只有彻底断绝贪欲的根源，对它们视而不见，就不会产生妄想；没有妄想，就不会犯错误了。\",\"core\":\"杜绝贪欲之源，不见可欲则心不乱。\"},{\"no\":\"2.49\",\"title\":\"人为情惑则忘返\",\"original\":\"子弟有耽于情欲，迷而忘返，至于破家而不悔者，盖始于试为之，由其中无所见，不能识破，则遂至于不可回。\",\"modern\":\"子弟中有人沉迷于情欲之中，迷途忘返，以至于败坏家业，而不知悔改。这些人开始时，都是想尝试一下，由于心中没有见识，不能看透后果，于是发展到不可挽回的地步。\",\"core\":\"子弟沉迷情欲始于尝试，因无见识而不可挽回，当早防之。\"},{\"no\":\"2.50\",\"title\":\"子弟当谨交游\",\"original\":\"世人有虑子弟血气未定，而酒色博弈之事，得以昏乱其心，寻至于失身破家，则拘之于家，严其出入，绝其交游，致其无所见闻，朴野蠢鄙，不近人情。殊不知此非良策。禁防一弛，情窦顿开，如火燎原，不可扑灭。况居之于家，无所用心，却密为不肖之事，与出外何异？不若时其出入，谨其交游，虽不肖之事习闻既熟，自能识破，必知愧而不为。纵试为之，亦不至于朴野蠢鄙，全为小人之所摇荡也。\",\"modern\":\"世上有人担心年轻人血气未定，酒色赌博会扰乱心神，以至于丧失品德、败坏家业，于是把子弟拘在家里，严防出入、断绝交游，使他们缺乏见闻、愚蠢鄙陋。岂不知这并非良策。一旦管教松弛，情欲就会爆发出来，如火燎原，不可扑灭。况且拘在家里，无所事事，就会偷偷做不该做的事，和让他们外出，有什么区别？不如让他们按时出去，告诉他们交友要谨慎，对于那些不该做的事，眼见耳闻，心中有数，自然能够识别，知道羞愧而不做。即使试着做了，也不至于愚蠢鄙陋，到完全被小人左右。\",\"core\":\"教育子弟当积极疏导而非消极封闭，谨其交游方为良策。\"},{\"no\":\"2.51\",\"title\":\"家成于忧惧破于怠忽\",\"original\":\"起家之人，生财富庶，乃日夜忧惧，虑不免于饥寒。破家之子，生事日消，乃轩昂自恣，谓“不复可虑”。所谓“吉人凶其吉，凶人吉其凶”，此其效验，常见于已壮未老，已老未死之前，识者当自默喻。\",\"modern\":\"创家立业的人，积聚财富后，每天忧虑不安，恐怕将来仍不免饥寒；败坏家业的人，使家财逐渐减少，还气宇轩昂地任意胡为，说“将来没什么可担心的”。这就是“有福之人把有福看作不幸的事，无福之人却以不幸为好事”。这常常在一个人壮年未老、老年未死之前应验，有见识的人应当自己领会。\",\"core\":\"创业者忧惧则存，败家者自恣则亡，忧乐反转是常理。\"},{\"no\":\"2.52\",\"title\":\"兴废有定理\",\"original\":\"起家之人，见所作事无不如意，以为智术巧妙如此，不知其命分偶然，志气洋洋，贪取图得。又自以为独能久远，不可破坏，岂不为造物者所窃笑？盖其破坏之人，或已生于其家，曰子曰孙，朝夕环立于其侧者，他日为父祖破坏生事之人，恨其父祖目不及见耳。前辈有建第宅，宴工匠于东庑曰：“此造宅之人。”宴子弟于西庑曰：“此卖宅之人。”后果如其言。近世士大夫有言：“目所可见者，漫尔经营；目所不及见者，不须置之谋虑。”此有识君子知非人力所及，其胸中宽泰，与蔽迷之人如何。\",\"modern\":\"创立家业的人，看见所做之事都称心如意，就认为自己智谋高明。不知成功是命运偶然的事，得意洋洋、贪婪索取，不知满足。自以为家业能永远兴盛、不可破坏，这不为造物者所耻笑吗？败坏家业的人，早已生在他们家了，或是儿子，或是孙子，每天环立在他身边的，都是有朝一日会败坏父祖家业的人，只可惜父祖看不到。前辈有人建宅第，在东厢房宴请工匠，说“这是造宅的人”；在西厢房宴请子弟，说“这是卖宅的人”，后来果然应验。近世有士大夫说“能看见的，就慢慢经营；看不到的，就不用去谋划”。这是有见识的人，知道有些事人力不及，所以心中安定，和那些被遮蔽迷惑的人，当然不同。\",\"core\":\"创业成功不可自满懈怠，败家之人已在身边，当有识量宽泰。\"},{\"no\":\"2.53\",\"title\":\"用度宜量入为出\",\"original\":\"起家之人，易为增进成立者，盖服食器用及吉凶百费，规模浅狭，尚循其旧，故日入之数，多于日出，此所以常有余。富家之子，易于倾覆破荡者，盖服食器用及吉凶百费，规模广大，尚循其旧，又分其财产立数门户，则费用增倍于前日。子弟有能省用，速谋损节犹虑不及，况有不之悟者，何以支持乎？古人谓“由俭入奢易，由奢入俭难”，盖谓此尔。大贵人之家尤难于保成。方其致位通显，虽在闲冷，其俸给亦厚，其馈遗亦多，其使令之人满前，皆州郡廪给，其服食器用虽极华侈，而其费不出于家财。逮其身后，无前日之俸给、馈遗使令之人，其日用百费非出家财不可。况又析一家为数家，而用度仍旧，岂不至于破荡？此亦势使之然，为子弟者各宜量节。\",\"modern\":\"创立家业的人，之所以能越积越多，因为服食器用和红白喜事花费都很节俭，遵循旧规，不铺张浪费，收入总多于支出，所以常有余。富家子弟之所以容易倾家荡产，因为花费太多、规模太大，还要循旧制，并且兄弟分家、各立门户，费用就比从前增加几倍。子弟中能节省费用、作长远打算的，恐怕还来不及呢，何况有人尚未省悟，如何支持下去？古人说“由俭入奢易，由奢入俭难”，说的就是这种情况。权贵人家，也不能保证子孙永不败坏。做官时，俸禄丰厚，馈赠很多，仆从费用由官方供给，服食虽然奢华，但不是出自家财。等到后世子孙，没有这些收入，一切费用，都从自家财产支出。况且又把一家分成好多家，而用度还和往昔一样，怎能不倾家荡产？这也是形势所趋，做子弟的，都应量入为出、勤俭持家。\",\"core\":\"量入为出、由俭入奢易由奢入俭难，持家当始终节俭。\"},{\"no\":\"2.54\",\"title\":\"起家守成宜为悠久计\",\"original\":\"人之居世，有不思父祖起家艰难，思与之延其祭祀，又不思子孙无所凭藉，则无以脱于饥寒。多生男女，视如路人，耽于酒色，博弈游荡，破坏家产，以取一时之快。此皆家门不幸。如此，冒干刑宪，彼亦不恤。岂教诲、劝谕、责骂之所能回？置之无可奈何而已。\",\"modern\":\"有些人活在世上，既不考虑父辈祖辈起家创业艰难，把家业继承下去；也不考虑将来家业败落，子孙就会失去依靠，难免忍饥受冻。不加节制地生下很多儿女，又视如路人，一味沉溺酒色、赌博游荡，败坏家产，求取一时享乐。这些人，都是家门不幸。连触犯刑律也不怕，又怎么能用教诲、劝导、责骂，使他们回心转意？对他们，只能无可奈何、听之任之了。\",\"core\":\"当思父祖创业艰难、子孙生计，不可耽于酒色败坏家产。\"},{\"no\":\"2.55\",\"title\":\"节用有常理\",\"original\":\"人有财物，虑为人所窃，则必缄縢扃鐍，封识之甚严。虑费用之无度而致耗散，则必算计较量，支用之甚节。然有甚严而有失者，盖百日之严，无一日之疏，则无失；百日严而一日不严，则一日之失与百日不严同也。有甚节而终至于匮乏者，盖百事节而无一事之费，则不至于匮乏，百事节而一事不节，则一事之费与百事不节同也。所谓百事者，自饮食、衣服、屋宅、园馆、舆马、仆御、器用、玩好，盖非一端。丰俭随其财力，则不谓之费。不量财力而为之，或虽财力可办，而过于侈靡，近于不急，皆妄费也。年少主家事者宜深知之。\",\"modern\":\"人们有了财物，怕被偷盗，就用绳索捆上、加锁，严格贴好封条。怕日常花费无度而耗散家产，就精心计算一切花销。然而有人虽然精打细算，还是破了产，因为一百天严格，只有一天疏忽，这一天的疏忽，与一百天不严格后果相同。有人十分节俭，最后还匮乏，因为百事都节俭，只一事不节俭，这一事的破费，与百事不节俭后果相同。所说的百事，就是饮食、衣服、住宅、园林、车马、仆人、器皿、古玩等。按自己财力使用，就不算浪费。不量财力去做，或虽有能力，却过于奢侈，做不紧急的事，都是乱花费。主持家事的年轻人，应深知此理。\",\"core\":\"节俭须持之以恒、事事皆节，一日一事之失可与百事不节同。\"},{\"no\":\"2.56\",\"title\":\"事贵预谋后则时失\",\"original\":\"中产之家，凡事不可不早虑。有男而为营生，教之生业，皆早虑也。至于养女，亦当早为储蓄衣衾、妆奁之具，及至遣嫁，乃不费力。若置而不问，但称临时，此有何术？不过临时鬻田庐，及不恤女子之羞见人也。至于家有老人，而送终之具不为素办，亦称临时。亦无他术，亦是临时鬻田庐，及不恤后事之不如仪也。今人有生一女而种杉万根者，待女长，则鬻杉以为嫁资，此其女必不至失时也。有于少壮之年，置寿衣寿器寿茔者，此其人必不至三日五日无衣无棺可敛，三年五年无地可葬也。\",\"modern\":\"中等家财的人家，什么事都不能不及早考虑。有男孩子的，要替他找生计、教生业，这些都是早打算。有女孩子的，也要及早准备衣物、被服、梳妆用具，到出嫁时，就不费力。如果置之不理，说到时候再说，有什么办法？不过临时变卖田产，或者不顾女儿脸面。家中有老人，也不提前准备送终之物，到时也只好变卖田产，不顾后事是否合乎礼仪。现在有人生女儿，就种一万棵杉树，等女儿长大，卖杉树做嫁妆，女儿就不至于错过婚期。有人在年轻时，就置办寿衣、寿器、坟地，就不至于死了三五天，还没有衣棺收殓；三年五年，还没有地安葬。\",\"core\":\"凡事预则立、不预则废，居家当早为长远打算。\"},{\"no\":\"2.57\",\"title\":\"居官居家本一理（治家如居官）\",\"original\":\"居官当如居家，必有顾藉；居家当如居官，必有纲纪。\",\"modern\":\"当官应当像当家一样，对百姓要像对待自己的子女一样，照顾爱惜；当家也应当像当官一样，用规矩来治家。\",\"core\":\"居官当有顾藉之心，居家当有纲纪之序，二者道理相通。\"},{\"no\":\"2.58\",\"title\":\"子弟当习儒业\",\"original\":\"士大夫之子弟，苟无世禄可守，无常产可依，而欲为仰事俯育之资，莫如为儒。其才质之美，能习进士业者，上可以取科第致富贵，次可以开门教授，以受束修之奉。其不能习进士业者，上可以事笔札，代笺简之役，次可以习点读，为童蒙之师。如不能为儒，则医卜、星相、农圃、商贾、使术，凡可以养生而不至于辱先者，皆可为也。子弟之流荡，至于为乞丐、盗窃，此最辱先之甚。然世之不能为儒者，乃不肯为医人、星相、农圃、商贾、伎术等事，而甘心为乞丐、盗窃者，深可诛也。凡强颜于贵人之前而求其所谓应副；折腰于富人之前而托名于假贷；游食于寺观而人指为穿云子，皆乞丐之流也。居官而掩蔽众目，盗财入己，居乡而欺凌愚弱，夺其所有，私贩官中所禁茶、盐、酒、酤之属，皆窃盗之流也。世人有为之而不自愧者，何哉？\",\"modern\":\"士大夫的子弟，如果没有世袭俸禄可以依靠，还想上养父母、下育妻儿，莫不如做儒生。才华过人的，可以准备参加科举考试，求得富贵；次一等，可以开设私塾，靠学费维持生活。没有能力参加科举的，可以替人代写书信；次一等，也可做孩童启蒙老师。做不了儒生，那就可以做医生、做僧道、做农夫花匠、做商人、做工匠，凡可以维持生活，又不至于辱没先人的工作，都可以去做。子弟游手好闲，沦为乞丐、盗贼，是最辱没先人的事。做不了儒生，又不肯做正当职业，而甘心做乞丐、盗贼的人，最该谴责。在权贵面前强颜欢笑、求施舍的；在富人面前卑躬屈膝、借贷的；到寺庙乞讨，而被人称为“穿云子”的，都是乞丐一类。做官贪污受贿，在乡里欺侮老弱、夺取财物、私贩国家禁止的茶盐酒的，都属于盗贼一类。世上有人这样做，而不自知惭愧，为什么呢？\",\"core\":\"子弟当务正业以求生存，凡可养生不辱先者皆可为，最忌沦为乞丐盗窃。\"},{\"no\":\"2.59\",\"title\":\"荒怠淫逸之患\",\"original\":\"凡人生而无业，及有业而喜于安逸，不肯尽力者，家富则习为下流，家贫则必为乞丐。凡人生而饮酒无算，食肉无度，好淫滥，习博弈者，家富则致于破荡，家贫则必为盗窃。\",\"modern\":\"人生在世，没有正当职业，或虽有职业，却喜欢安逸、不肯尽力的人，家庭富有，就会不务正业，成为下流无耻之人；家庭贫困，就会做乞丐。人生在世，不加节制地饮酒吃肉、荒淫无度、染有赌博恶习的人，家里富有，就会败坏财产；家里贫困，就会去做盗贼。\",\"core\":\"无业或荒淫者，富则下流破荡，贫则乞丐盗窃。\"},{\"no\":\"2.60\",\"title\":\"周急贵乎当理\",\"original\":\"人有患难不能济，困苦无所诉，贫乏不自存，而其人朴讷怀愧，不能自言于人者，吾虽无余，亦当随力周助。此人纵不能报，亦必知恩。若其本非窘乏，而以干谒为业，挟持便佞之术，遍谒贵人富人之门，过州干州，过县干县，有所得则以为己能，无所得则以为怨仇。在今日则无感恩之心，在他日则无报德之事，正可以不恤不顾待之。岂可割吾之不敢用，以资他之不当用？\",\"modern\":\"有人遇到无法克服的祸患困难，无处诉说，贫穷得生活不下去，又质朴木讷、面有愧色，不好意思求助。遇到这样的人，我虽然手头不宽裕，也要尽力帮助周济。此人即使不能回报，也一定感激恩德。如果有人本来不贫困，只是到处阿谀奉承、请求施舍，无论路过州县都这样，得到施舍，就吹嘘自己有才能；得不到，就和人家结仇。这种人，现在不会感激恩德，他日也不会报答恩德，完全可以不顾念他。怎么能舍出平时都不舍得用的钱财，去帮助他干不该干的事呢？\",\"core\":\"周济当择人，当助朴讷知恩者，不当助干谒无赖之徒。\"},{\"no\":\"2.61\",\"title\":\"不可轻受人恩\",\"original\":\"居乡及在旅，不可轻受人之恩。方吾未达之时，受人之恩，常在吾怀，每见其人，常怀敬畏，而其人亦以有恩在我，常有德色。及吾荣达之后，遍报则有所不及，不报则为亏义，故虽一饭一缣，亦不可轻受。前辈见人仕宦而广求知己，戒之曰：“受恩多，则难以立朝。”宜详味此。\",\"modern\":\"在乡里或寄居在外，都不能轻易接受人家恩惠。在我没有发达时，受了恩惠，常常记在心里，每次见施恩之人，心里都很敬畏；而那人因为觉得有恩于我，神色上也常表现出来。等到我荣耀显达后，想报答所有恩人，恐怕做不到；不报答，又觉得理亏。因此，即使一顿饭、一丝绢，也不能轻易接受。前辈看见有人做官时广求知己，告诫说“受恩多，就难以在朝廷立足”，应该好好体会这句话。\",\"core\":\"不可轻受人恩，受恩多则难以自立。\"},{\"no\":\"2.62\",\"title\":\"受人恩惠当记省\",\"original\":\"今人受人恩惠多不记省，而人所急于人，虽微物亦历历在心，古人言：施人勿念，受施勿忘。诚为难事。\",\"modern\":\"现在的人，接受别人恩惠，大多不记在心里；但有恩于别人，即使微不足道的东西，也清清楚楚记在心中。古人说：不要记住你对他人的恩惠，不要忘掉他人对你的恩惠。能做到这一点，确实很困难。\",\"core\":\"施人勿念、受施勿忘，知恩图报是美德。\"},{\"no\":\"2.63\",\"title\":\"人情厚薄勿深较\",\"original\":\"人有居贫困时，不为乡人所顾，及其荣达，则视乡人如仇雠。殊不知乡人不厚于我，我以为憾；我不厚于乡人，乡人他日亦独不记耶？但于平时薄我者，勿与之厚，亦不必致怨。若其平时不与吾相识，苟我可以济助之者，亦不可不为也。\",\"modern\":\"有人在贫困时，没有得到乡里人照顾，等荣耀显达后，就把乡里人视作仇人。殊不知乡里人当初不厚待我，我感到怨恨；我不厚待乡里人，他们他日难道就不记得了吗？只是对平时鄙薄我的人，不与他深交，也不必怨恨他。对那些平时不相识的乡里人，如果我能周济帮助，也不能不这样做。\",\"core\":\"人情厚薄当以宽容处之，不念旧恶、不计前嫌。\"},{\"no\":\"2.64\",\"title\":\"报怨以直乃公心\",\"original\":\"圣人言“以直报怨”，最是中道，可以通行。大抵以怨报怨，固不足道，而士大夫欲邀长厚之名者，或因宿仇，纵奸邪而不治，皆矫饰不近人情。圣人之所谓直者，其人贤，不以仇而废之；其人不肖，不以仇而庇之。是非去取，各当其实。以此报怨，必不至递相酬复无已时也。\",\"modern\":\"圣人说“对待仇怨，须以正直之道来对待”，最符合中庸之道，可以通行。以怨报怨，当然不足称道；而有的士大夫，为博取仁厚名声，放纵奸邪之人不去惩治，都是虚伪、不合情理的做法。圣人说的正直，就是他人贤德，不因仇怨而废掉；他人不肖，也不因仇怨而庇护。是非取舍，当根据实际情况来定。以直报怨，就不会无休无止地互相报复了。\",\"core\":\"以直报怨是中道，不以仇废贤、不以仇庇劣，是非当如其实际。\"},{\"no\":\"2.65\",\"title\":\"讼不可长\",\"original\":\"居乡不得已而后与人争，又不得已而后与人讼，彼稍服其不然则已之，不必费用财物，交结胥吏，求以快意，穷治其仇。至于争讼财产，本无理而强求得理，官吏贪谬，或可如志，宁不有愧于神明！仇者不伏，更相诉讼，所费财物，十数倍于其所直，况遇贤明有司，安得以无理为有理耶？大抵人之所讼互有短长，各言其长而掩其短，有司不明，则牵连不决。或决而不尽其情，胥吏得以受赇而弄法，蔽者之所以破家也。\",\"modern\":\"住在乡里，实在没办法，才能和别人争论；争论不能解决，才能打官司。对方认了错，就算了，不必耗费财物、勾结官吏、严惩对方，求得满足。至于争讼财产，本来没理，而强求有理；遇到贪官，或可满足，难道不有愧于神明？对方不服，还要上诉，所费钱财，比所争之物贵十倍。况且遇到贤明官吏，怎能以无理为有理？一般来说，打官司的人，都各有长短，各自掩饰短处；官吏不能明察，就牵连不决，或不按实情判决；官吏贪赃枉法，头脑糊涂的人，就会因此破产。\",\"core\":\"诉讼当适可而止，万不得已方为之，不可求快意而穷治。\"},{\"no\":\"2.66\",\"title\":\"暴吏害民必天诛\",\"original\":\"官有贪暴，吏有横刻，贤豪之人不忍乡曲众被其恶，故出力而讼之。然贪暴之官，必有所恃，或以其有亲党在要路，或以其为州郡所深喜，故常难动摇。横刻之吏，亦有所恃，或以其为见任官之所喜，或以其结州曹吏之有素，故常无忌惮。及至人户有所诉，则官求势要之书以请托，吏以官库之钱而行赂，毁去簿书，改易案牍。人户虽健讼，亦未便轻胜。兼论诉官吏之人，又只欲劫持官府，使之独畏己，初无为众除害之心。常见论诉州县官吏之人，恃为官吏所畏，拖延税赋不纳；人户有折变，己独不受折变；人户有科敷，己独不伏科敷。睨立庭下，抗对长官；端坐司房，骂辱胥辈；冒占官产，不肯输租；欺凌善弱，强欲断治；请托公事，必欲以曲为直；或与胥吏通同为奸，把持官员，使之听其所为，以残害乡民。如此之官吏，如此之奸民，假以岁月，纵免人祸，必自为天所诛也。\",\"modern\":\"官员中有贪婪暴虐的，吏役中有横蛮苛刻的。贤豪之人不忍乡里众人受其祸害，便出面告状。然而贪暴的官员必有所依仗：或有亲友在要害部门，或为州郡长官所宠信，所以很难动摇。横刻的吏役也有所依仗：或为现任官所喜，或与州曹吏役素有交情，所以常常肆无忌惮。等到民户告状，官员就求权要写书信请托，吏役就用官库的钱行贿，销毁簿册、篡改案卷。告状的人即使善于诉讼，也不易轻易取胜。何况告状的人往往只想挟持官府、让官府独怕自己，本无为众人除害之心。常见控告州县官吏的人，倚仗官吏畏惧自己，便拖延税赋不纳；别人要折变，唯独他不接受折变；别人要科敷，唯独他不服从科敷。斜立于庭下，抗对长官；端坐于司房，辱骂胥吏；冒占官产，不肯交租；欺凌善良软弱之人，强行要求断案；请托公事，一定要以曲为直；甚至与胥吏串通为奸，把持官员，使其听任自己所为，残害乡民。这样的官吏，这样的奸民，假以时日，纵然逃过人祸，也必定被上天所诛杀。\",\"core\":\"贪暴官吏与奸民勾结残害乡里，纵然暂免人祸，终必为天所诛。\"},{\"no\":\"2.67\",\"title\":\"民俗淳顽当求其实\",\"original\":\"士大夫相见，往往多言某县民淳，某县民顽。及询其所以然，乃谓见任官赃污狼籍，乡民吞声饮气而不敢言，则为淳；乡民列其恶，诉之州郡监司，则为顽。此其得顽之名，岂不枉哉？今人多指奉化县为顽，问之奉化人，则曰：“所讼之官皆有入己赃，何谓奉化为顽？”如黄岩等处人言皆然。此正圣人所谓“斯民也，三代之所以直道而行也”，何顽之有？今具其所以为顽之目：应纳税赋而不纳，及应供科配而不供，则为顽；若官中因事广科，从而隐瞒，其民户不肯供纳，则不为顽。官吏断事，出于至公，又合法意，乃任私忿，求以翻异，则为顽；官吏受财，断直为曲，事有冤抑，次第陈诉，则不为顽。官员清正，断事自己，豪横之民无所行赂，无所措谋，则与胥吏表里撰合语言，妆点事务，妄兴论诉，则为顽；若官员与吏为徒，百般诡计，掩人耳目，受接贿赂，偷盗官钱，人户有能出力，为众论诉，则不为顽。\",\"modern\":\"士大夫相见，往往说某县民风淳朴、某县民风刁顽。细问原因，竟是说现任官贪赃枉法、乡民忍气吞声不敢言，就算\\\"淳\\\"；乡民列举其恶行、向州郡监司告状，就算\\\"顽\\\"。这样得\\\"顽\\\"的名声，岂不冤枉？如今人们多指奉化县为\\\"顽\\\"，问奉化人，则说：\\\"所告的官都有入己的赃款，凭什么说奉化顽？\\\"黄岩等处的人说法也一样。这正是圣人所说的\\\"这样的百姓，正是三代能够直道而行的原因\\\"，有什么\\\"顽\\\"可言？具体列举何为\\\"顽\\\"：应纳税赋而不纳、应供科配而不供，就是顽；若官府借事广行摊派、隐瞒实情，民户不肯供纳，则不算顽。官吏断事出于至公又合法意，却任私忿要求翻案，就是顽；官吏受贿、断直为曲，百姓有冤屈依次申诉，则不算顽。官员清正、自行断事，豪横之民无处行贿、无处使计，便与胥吏表里串通、编造言辞、妆点事端、妄兴诉讼，就是顽；若官员与吏役结为一党、百般诡计掩人耳目、收受贿赂、偷盗官钱，民户能出力为众人申诉，则不算顽。\",\"core\":\"所谓民淳民顽往往是非颠倒，当探究实情，不可被表面之论蒙蔽。\"},{\"no\":\"2.68\",\"title\":\"官有科付之弊\",\"original\":\"县道有非理横科，及预借官物者，必相率而次第陈讼。盖两税自有常额，足以充上供、州用、县用；役钱亦有常额，足以供解发支雇。县官正己以率下，则民间无隐负不输，官中无侵盗妄用，未敢以为有余，亦何不足之有！惟作县之人不自检己，吃者、着者、日用者，般挈往来，送遗结托，置造器用，储蓄囊箧，及其他百色之须，取给于手分、乡司。为手分、乡司者，岂有将己财奉县官，不过就簿历之中，恣为欺弊；或揽人户税物而不纳；或将到库之钱而他用；或伪作过军、过客券旁，及修葺廨舍，而公求支破；或阳为解发而中途截拨。其弊百端，不可悉举。县官既素受其污啖，往往知而不问；况又有懵然不晓财赋之利病；及晓之者，又与之通同作弊。一年之间，虽至小邑，亏失数千缗，殆不觉也。于是有横科预借之患，及有拖欠州郡之数。及将任满，请托关节以求脱去，而州郡遂将积欠勒令后政补偿。夫前政以一年财赋不足一年支解，为后政者岂能以一年财赋补足数年财赋？故于前政预借钱物，多不认理，或别设巧计，阴夺民财，以求补足旧欠，其祸可胜言哉！\",\"modern\":\"县里有不合理的横征暴敛和预借官物之事，百姓应当相约依次告状。两税自有固定数额，足以供应上供、州用、县用；役钱也有固定数额，足以供给解发、支雇。县官端正自身以表率下属，民间就没有隐瞒拖欠的税赋，官中就没有侵吞盗用、胡乱开支，虽不敢说有结余，又怎会不够用？只因做县官的人不检点自己：吃喝、穿戴、日用、搬运往来、送礼请托、置办器物、储蓄私囊，以及其他各种需求，都取办于手分、乡司。做手分、乡司的，岂会拿自己的钱奉承县官？不过是在簿书账册中肆意作弊：或揽收民户税物而不缴纳，或将入库的钱挪作他用，或伪造过军、过客券契以及修缮官舍的名目公然支取，或表面解发而中途截留。弊端百出，不可尽数。县官既一向受其污利供养，往往知而不问；况且还有糊涂不懂财赋利弊的；而懂的人，又与他们通同作弊。一年之间，即使是最小的县城，亏损数千缗也毫不察觉。于是产生横科预借的祸患，以及拖欠州郡的数目。等到任期将满，便请托关节以求脱身，州郡就把积欠勒令后任补偿。前任一年的财赋不够一年的支解，后任怎能用一年的财赋补足数年的亏空？所以对前任预借的钱物大多不认账，或另设巧计暗夺民财，以补足旧欠，其中的祸害哪里说得完！\",\"core\":\"县官不检点导致胥吏作弊、横科预借，层层转嫁最终祸害百姓。\"}]");

  var list = document.getElementById('entry-list');
  var countEl = document.getElementById('chn-count');
  if (countEl) countEl.textContent = String(CHUJI.length);
  // 渲染前清空容器，杜绝任何静态副本导致条目重复
  list.innerHTML = '';
  if (!CHUJI || !CHUJI.length) {
    list.innerHTML = '<p style="color:var(--ink-soft);font-size:14px">暂未加载到条目数据。</p>';
    return;
  }

  var frag = document.createDocumentFragment();
  CHUJI.forEach(function(it, num){
    var art = document.createElement('article');
    art.className = 'entry';
    var s = document.createElement('button');
    s.type = 'button'; s.className = 'entry-toggle'; s.setAttribute('aria-expanded','false');
    var seq = num + 1; var no = document.createElement('span');
    no.className='no'; no.textContent = (seq < 10 ? '0' : '') + seq;
    var tt = document.createElement('span'); tt.className='tt'; tt.textContent = it.title || '';
    s.appendChild(no); s.appendChild(tt);

    var body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = [
      '<div class="block tx"><div class="block-label">【原文】</div><p></p></div>',
      '<div class="block modern"><div class="block-label">【白话译解】</div><p></p></div>'
    ].join('');
    body.querySelector('.block.tx p').textContent = it.original || '';
    body.querySelector('.block.modern p').textContent = it.modern || '';
    if (it.core){
      var cl = document.createElement('div');
      cl.className = 'core-line';
      cl.textContent = '要旨：' + it.core;
      body.appendChild(cl);
    }

    var askWrap = document.createElement('div');
    askWrap.className = 'ask';
    var askBtn = document.createElement('button');
    askBtn.type = 'button'; askBtn.className = 'ask-btn';
    askBtn.textContent = '就这一章向袁采先生请教';
    askBtn.addEventListener('click', function(){
      // 跳到右栏对话区：让对话框进入视野并聚焦，回复出现时滚动到底部
      var chatPane = document.querySelector('.chat-pane');
      var winScroll = document.scrollingElement || document.documentElement;
      if (chatPane){
        var chatTop = chatPane.getBoundingClientRect().top + winScroll.scrollTop;
        if (chatTop < winScroll.scrollTop - 16 || chatTop > winScroll.scrollTop + winScroll.clientHeight - 16){
          chatPane.scrollIntoView({behavior:'smooth', block:'start'});
        }
      }
      var msgsEl = document.getElementById('chat-msgs');
      if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
      var inp = document.getElementById('chat-input'); if (inp) inp.focus();
      // 构造提问，自动发送：针对当前章节做深入解读
      var question = '我现在读到《袁氏世范》"'+ (it.title || '') +'"这一章，请您结合本章原文与大意，给我深入讲讲这一则的处世道理。';
      setTimeout(function(){ window.send(question); }, 450);
    });
    askWrap.appendChild(askBtn);
    body.appendChild(askWrap);

    var wrap = document.createElement('div'); wrap.className = 'entry-body';
    wrap.appendChild(body);
    art.appendChild(s); art.appendChild(wrap);
    frag.appendChild(art);
  });
  list.appendChild(frag);

  /* 折叠交互：在列表容器上做一次事件委托（动态条目也生效，不丢事件）。
     - 点击标题行任意位置切换 .expanded
     - 手风琴：展开新条目时自动收起其他条目
     - “问先生”按钮在内容区内，closest('.entry-toggle') 为 null，不会误触发折叠 */
  list.addEventListener('click', function(e){
    if (e.target.closest('.ask-btn')) return;
    var toggle = e.target.closest('.entry-toggle');
    if (!toggle) return;
    var art = toggle.closest('.entry');
    if (!art) return;
    var willOpen = !art.classList.contains('expanded');
    list.querySelectorAll('.entry.expanded').forEach(function(prev){
      if (prev === art) return;
      prev.classList.remove('expanded');
      var pt = prev.querySelector('.entry-toggle');
      if (pt) pt.setAttribute('aria-expanded','false');
    });
    art.classList.toggle('expanded', willOpen);
    toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });

  // 示例问题
  var pillsWrap = document.getElementById('chat-pills');
  var samples = [
    '先生，人该如何面对世间不平？',
    '室友总爱炫耀，心里不舒服怎么办？',
    '努力了很久却没有结果，觉得很没用。',
    '不知道怎么和人相处，总觉得自己格格不入。'
  ];
  var pf = document.createDocumentFragment();
  samples.forEach(function(q){
    var b = document.createElement('button'); b.type='button'; b.className='pill'; b.textContent=q;
    b.addEventListener('click', function(){
      var inp = document.getElementById('chat-input'); if (inp) inp.focus();
    });
    pf.appendChild(b);
  });
  pillsWrap.appendChild(pf);
})();
</script>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var msgs = $('chat-msgs'), input = $('chat-input'), sendBtn = $('chat-send');

  /* ---------- 消息渲染 ---------- */
  function normText(s){
    return String(s || '').replace(/\r\n?/g, '\n').replace(/(\n[ \t]*)+/g, '\n').replace(/^\n|\n$/g, '');
  }
  function addMsg(role, text, src){
    var m = document.createElement('div'); m.className = 'msg ' + role;
    var who = document.createElement('div'); who.className = 'who';
    who.textContent = role === 'user' ? '我' : '袁采';
    var b = document.createElement('div'); b.className = 'bubble';
    b.textContent = normText(text);
    m.appendChild(who); m.appendChild(b);
    if (src){
      var s = document.createElement('div'); s.className = 'src'; s.textContent = src;
      m.appendChild(s);
    }
    var now = new Date();
    var tm = document.createElement('div'); tm.className = 'mt';
    tm.textContent = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
    m.appendChild(tm);
    msgs.appendChild(m);
    msgs.scrollTop = msgs.scrollHeight;
    return m;
  }
  function addTyping(){
    var b = document.createElement('div');
    b.className = 'bubble bubble-think';
    b.textContent = '容老夫思考片刻……';
    msgs.appendChild(b);
    msgs.scrollTop = msgs.scrollHeight;
    return function(){ b.remove(); };
  }
  addMsg('bot', '老朽袁采，在此有礼了。世人常困于眼前方寸，不知心宽即是天地。你有何困惑，或是遇到了什么人、什么事，不妨与我说说。');

  /* ---------- 发送 ---------- */
  window.send = function(text){
    var q = (text || input.value).trim();
    if (!q) return;
    input.value = ''; autoGrow();
    addMsg('user', q);
    sendBtn.disabled = true; input.disabled = true;
    var stopTyping = addTyping();
    askBackend(q)
      .then(function(reply){
        stopTyping();
        addMsg('bot', reply.text, reply.src);
      })
      .catch(function(err){
        stopTyping();
        addMsg('bot', '（抱歉，先生一时未能作答，请稍后再试：' + (err && err.message ? err.message : '网络异常') + '）');
      })
      .finally(function(){
        sendBtn.disabled = false; input.disabled = false; input.focus();
      });
  }
  sendBtn.addEventListener('click', function(){ send(); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  function autoGrow(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
  input.addEventListener('input', autoGrow);

  /* 示例问题：点击即发送 */
  var quick = $('chat-pills');
  if (quick){
    Array.prototype.forEach.call(quick.querySelectorAll('.pill'), function(btn){
      var q = btn.textContent;
      btn.addEventListener('click', function(){ send(q); });
    });
  }

  /* ---------- 向本站后端代理请求对话（SSE 流式：心跳保活 + 失败自动重试） ---------- */
  function askOnce(text){
    return fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    }).then(function(r){
      var ctype = r.headers.get('content-type') || '';
      // 非流式响应（参数校验/配置错误等）：按普通 JSON 错误处理
      if (r.status !== 200 || ctype.indexOf('text/event-stream') === -1){
        return r.json().catch(function(){ return { error: 'HTTP ' + r.status }; })
          .then(function(j){ throw new Error((j && j.error) || ('HTTP ' + r.status)); });
      }
      if (!r.body || !r.body.getReader){
        // 极旧浏览器兜底
        return r.json().then(function(j){
          if (j.error) throw new Error(j.error);
          return { text: j.reply || '', src: j.src || '' };
        });
      }
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      var last = null;
      function pump(){
        return reader.read().then(function(chunk){
          if (chunk.done) return last;
          buf += decoder.decode(chunk.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n\n')) !== -1){
            var raw = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            var line = null;
            raw.split('\n').forEach(function(l){ if (l.indexOf('data:') === 0) line = l.slice(5).trim(); });
            if (!line) continue;
            try {
              var ev = JSON.parse(line);
              if (ev.type === 'done' || ev.type === 'error') last = ev;
            } catch (_) {}
          }
          return pump();
        });
      }
      return pump().then(function(ev){
        if (!ev) throw new Error('连接中断，请重试');
        if (ev.type === 'error') throw new Error(ev.error || '生成失败，请重试');
        return { text: ev.reply || '(先生微有片刻沉吟，未能作答。请换一句话再问。)', src: ev.src || '' };
      });
    });
  }

  /* 网络抖动（pages.dev 在部分国内网络下长连接会被随机重置）时自动重试，最多 3 次 */
  function askBackend(text){
    var attempts = 0;
    function attempt(){
      attempts++;
      return askOnce(text).catch(function(err){
        var msg = String(err && err.message ? err.message : err);
        var retriable = /Failed to fetch|连接中断|NetworkError|network|ERR_|load failed/i.test(msg);
        if (retriable && attempts < 3){
          return new Promise(function(res){ setTimeout(res, 600 * attempts); }).then(attempt);
        }
        throw err;
      });
    }
    return attempt();
  }
})();
</script>
<script>
  /* 侧边卷轴与内容栏严格等高 */
  (function(){
    function sync(){
      var p = document.querySelector('.pane.read');
      var ds = document.querySelectorAll('.scroll-deco');
      if (!p) return;
      var r = p.getBoundingClientRect();
      var h = r.height + 'px';
      var t = r.top + 'px';
      for (var i = 0; i < ds.length; i++){
        ds[i].style.height = h;
        ds[i].style.top = t;
        ds[i].style.transform = 'translateY(0)';
      }
    }
    sync();
    window.addEventListener('resize', sync);
  })();

  /* ---------- 开卷动画控制 ---------- */
  (function(){
    var intro = document.getElementById('intro');
    if (!intro) return;
    var open = false;
    function run(){
      if (!open){ intro.classList.add('open'); open = true; }
      clearTimeout(run._t);
      run._t = setTimeout(function(){ intro.classList.add('hide'); }, 4300);
      setTimeout(function(){ if (intro) { intro.style.display = 'none'; intro.remove(); } }, 5200);
    }
    window.addEventListener('load', function(){ setTimeout(run, 60); });
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 60); });
    // 硬保底：即使 load/DOMContentLoaded 因资源卡住未触发，2.5s 后也强制播放并在随后移除
    setTimeout(function(){ setTimeout(run, 60); }, 2500);
    // 动画期间用户的第一次点击：立即收起动画层，绝不阻挡页面任何交互
    document.addEventListener('pointerdown', function dismiss(){
      if (intro && !intro.classList.contains('hide')) intro.classList.add('hide');
      setTimeout(function(){ if (intro) { intro.style.display = 'none'; intro.remove(); } }, 250);
      document.removeEventListener('pointerdown', dismiss, true);
    }, true);
    if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(run, 120);
  })();
</script>
